<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Streak Builder</title>

<meta name="theme-color" content="#15161c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Streak Builder"/>
<link rel="manifest" href="manifest.json"/>

<style>
:root{
  --bg1:#15161c; --bg2:#1b1c24;
  --card:#1e1f27; --surface:#262832; --surface2:#2a2c37; --form-bg:#22232c;
  --track:#2f313d; --bartrack:#2f313d; --tab-on:#383a46;
  --line:#33353f; --line-soft:#2a2c34;
  --ink:#f2f3f8; --sub:#a7adba; --faint:#7c8291; --faint2:#4b4e5a;
  --inp-bg:#262832; --row-active:#2a2c37; --cbx-border:#454956;
  --shadow:0 10px 34px rgba(0,0,0,.4);
  --green:#22c55e; --amber:#f59e0b; --danger:#f87171;
  --accent:#6d5cf0; --accent-light:#9b8bff; --accent-soft:rgba(109,92,240,0.18);
}
[data-theme="light"]{
  --bg1:#f3f4f8; --bg2:#edeef6;
  --card:#ffffff; --surface:#f7f8fb; --surface2:#f1f2f7; --form-bg:#fafbfd;
  --track:#eef0f5; --bartrack:#eceef3; --tab-on:#ffffff;
  --line:#e6e8ee; --line-soft:#f0f1f5;
  --ink:#111827; --sub:#6b7280; --faint:#9ca3af; --faint2:#d4d7de;
  --inp-bg:#ffffff; --row-active:#f4f5f8; --cbx-border:#d3d7e0;
  --shadow:0 10px 34px rgba(24,28,45,.07);
  --danger:#ef4444;
  --accent-soft:#efedff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html, body{
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background-color: var(--bg1);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  overflow-x: hidden;
  transition: background-color 0.3s;
}

.app-container {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 16px);
}

h1, h2, h3 { margin: 0; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  transition: background .3s, border-color .3s;
}

.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.brandtitle {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: .12em;
  color: var(--ink);
}
.datesub {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--accent);
  margin-top: 3px;
  text-transform: uppercase;
}

.head-actions {
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s;
}
.icon-btn:active { transform: scale(.92); }

.lang-selector {
  display: flex;
  background: var(--surface2);
  padding: 3px;
  border-radius: 12px;
  gap: 2px;
  margin-bottom: 16px;
}
.lang-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--sub);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 0;
  border-radius: 9px;
  cursor: pointer;
  transition: .2s;
}
.lang-btn.active {
  background: var(--accent);
  color: #fff;
}

.days-grid {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}
.day-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}
.day-name {
  font-size: 11px;
  font-weight: 800;
  color: var(--faint);
  text-transform: uppercase;
}
.day-name.today { color: var(--accent); }
.day-track {
  position: relative;
  width: 100%;
  height: 76px;
  border-radius: 12px;
  background: var(--track);
  overflow: hidden;
}
.day-col.selected .day-track {
  outline: 2px solid var(--accent);
}
.day-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, var(--accent-light), var(--accent));
  border-radius: 12px;
  transition: height .3s cubic-bezier(.4,0,.2,1);
}

.health-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}
.health-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
}
.health-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .05em;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-bottom: 10px;
}

.watergauge {
  position: relative;
  width: 50px;
  height: 72px;
  margin: 0 auto;
  border-radius: 14px;
  background: var(--track);
  overflow: hidden;
  border: 1px solid var(--line);
}
.waterfill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #38bdf8, #0284c7);
  transition: height .4s ease;
}
.waternum {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink);
}

.wbtns {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-top: 10px;
}
.wbtn {
  border: 1px solid var(--line);
  background: var(--inp-bg);
  color: var(--ink);
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  padding: 5px 7px;
  cursor: pointer;
}
.wbtn:active { border-color: var(--accent); color: var(--accent); }

.ringwrap {
  position: relative;
  width: 72px;
  height: 72px;
  margin: 0 auto;
}
.ring { width: 72px; height: 72px; transform: rotate(-90deg); }
.ringbg { fill: none; stroke: var(--track); stroke-width: 7; }
.ringfg { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ringnum {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}

.progress-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 18px;
}
.progress-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.progress-bar-bg {
  background: var(--track);
  height: 8px;
  border-radius: 8px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 8px;
  transition: width .4s ease;
}

.habit-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.habit-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  transition: .15s;
  cursor: pointer;
}
.habit-row:active { transform: scale(.98); }
.cbx {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 2px solid var(--cbx-border);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--inp-bg);
  flex-shrink: 0;
  font-weight: bold;
}
.cbx.done {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.habit-mid { flex: 1; min-width: 0; }
.habit-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.habit-name.done {
  text-decoration: line-through;
  color: var(--faint);
}
.habit-sub {
  font-size: 11px;
  color: var(--amber);
  font-weight: 700;
  margin-top: 2px;
}

.add-form {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.add-inp {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  background: var(--inp-bg);
  color: var(--ink);
  outline: none;
}
.add-inp:focus { border-color: var(--accent); }
.add-btn {
  border: none;
  background: var(--accent);
  color: #fff;
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 700;
  cursor: pointer;
}

.bottombar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 12px);
  width: calc(100% - 32px);
  max-width: 460px;
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 22px;
  z-index: 40;
  background: rgba(30, 31, 39, 0.75);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.4);
}
[data-theme="light"] .bottombar {
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.8);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.12);
}

.bbtab {
  flex: 1;
  border: none;
  cursor: pointer;
  padding: 8px 4px;
  border-radius: 16px;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: transparent;
  color: var(--sub);
  transition: .18s;
}
.bbtab.on {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 14px var(--accent-soft);
}

.troph-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.troph-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
}
.tb-badge { font-size: 28px; margin-bottom: 6px; }
.tb-name { font-size: 13px; font-weight: 700; color: var(--ink); }
.tb-desc { font-size: 11px; color: var(--faint); margin-top: 2px; }

.calgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.calday {
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--sub);
}
.calday.perfect {
  border: 2px solid var(--amber);
  color: var(--ink);
  background: rgba(245, 158, 11, 0.15);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 380px;
}

.hide { display: none !important; }
</style>
</head>
<body>

<div class="app-container">
  <div class="card">
    <!-- Header -->
    <div class="head">
      <div>
        <h1 class="brandtitle">STREAK BUILDER</h1>
        <div class="datesub" id="dateDisplay">--</div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
      </div>
    </div>

    <!-- Language Selector -->
    <div class="lang-selector">
      <button class="lang-btn" id="lang-fr" onclick="setLanguage('fr')">FR</button>
      <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">EN</button>
      <button class="lang-btn" id="lang-es" onclick="setLanguage('es')">ES</button>
    </div>

    <!-- Days Selector -->
    <div class="days-grid" id="daysGrid"></div>

    <!-- Main Tab: Week -->
    <div id="tab-week" class="tab-content">
      <!-- Health Module -->
      <div class="health-grid">
        <div class="health-card">
          <div class="health-title">💧 <span id="lbl-water">EAU</span></div>
          <div class="watergauge">
            <div class="waterfill" id="waterFill" style="height: 50%;"></div>
            <div class="waternum" id="waterNum">1.25L</div>
          </div>
          <div class="wbtns">
            <button class="wbtn" onclick="addWater(25)">+25cl</button>
            <button class="wbtn" onclick="addWater(50)">+50cl</button>
            <button class="wbtn" onclick="addWater(100)">+1L</button>
          </div>
        </div>

        <div class="health-card">
          <div class="health-title">👟 <span id="lbl-steps">PAS</span></div>
          <div class="ringwrap">
            <svg class="ring" viewBox="0 0 36 36">
              <path class="ringbg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
              <path class="ringfg" id="stepRing" stroke-dasharray="84, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <div class="ringnum" id="stepNum">8.4k</div>
          </div>
          <div style="font-size:10px; color:var(--faint); margin-top:8px; font-weight:700;" id="lbl-stepgoal">Obj: 10,000</div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-panel">
        <div class="progress-head">
          <span id="lbl-progtitle">PROGRESSION</span>
          <span id="progText" style="color:var(--accent);">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progBar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Habits List -->
      <div class="habit-list" id="habitsList"></div>

      <!-- Add Habit Input -->
      <div class="add-form">
        <input type="text" class="add-inp" id="newHabitInp" placeholder="Nouvelle habitude..." />
        <button class="add-btn" onclick="addNewHabit()" id="lbl-addbtn">Ajouter</button>
      </div>
    </div>

    <!-- Stats Tab -->
    <div id="tab-stats" class="tab-content hide">
      <h3 style="font-size:14px; font-weight:800; margin-bottom:12px; color:var(--ink);" id="calTitle">CALENDRIER</h3>
      <div class="calgrid" id="calGrid"></div>
    </div>

    <!-- Trophies Tab -->
    <div id="tab-trophies" class="tab-content hide">
      <div class="troph-grid" id="trophiesGrid"></div>
    </div>

    <!-- Siri Tab -->
    <div id="tab-siri" class="tab-content hide">
      <div style="font-size:13px; line-height:1.5; color:var(--sub);" id="siriHelp"></div>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottombar">
  <button class="bbtab on" onclick="switchTab('week', this)"><span>📅</span><span id="nav-week">Semaine</span></button>
  <button class="bbtab" onclick="switchTab('stats', this)"><span>📊</span><span id="nav-stats">Stats</span></button>
  <button class="bbtab" onclick="switchTab('trophies', this)"><span>🏆</span><span id="nav-trophies">Trophées</span></button>
  <button class="bbtab" onclick="switchTab('siri', this)"><span>🎙️</span><span id="nav-siri">Siri</span></button>
</nav>

<!-- Modal Settings -->
<div class="modal-overlay hide" id="settingsOverlay">
  <div class="modal-box">
    <h3 style="margin-top:0; color:var(--ink);" id="lbl-settitle">Réglages</h3>
    <p style="font-size:13px; color:var(--sub); line-height:1.4;" id="lbl-setdesc">
      Vos données sont enregistrées localement sur votre iPhone.
    </p>
    <button onclick="resetData()" style="border:none; background:var(--danger); color:#fff; padding:10px; width:100%; border-radius:12px; font-weight:700; cursor:pointer; margin-bottom:10px;" id="lbl-resetbtn">
      Réinitialiser les habitudes
    </button>
    <button onclick="closeSettings()" style="border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:10px; width:100%; border-radius:12px; font-weight:700; cursor:pointer;">
      Fermer
    </button>
  </div>
</div>

<script>
const DSHORT = {
  fr: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
  en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
  es: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom']
};

const DEFAULT_HABITS = {
  fr: [
    { id: 1, name: "Musculation & Force", streak: 5, done: true },
    { id: 2, name: "Course & Sprint", streak: 3, done: true },
    { id: 3, name: "Lecture (20 min)", streak: 12, done: false },
    { id: 4, name: "Méditation", streak: 0, done: false }
  ],
  en: [
    { id: 1, name: "Strength Training", streak: 5, done: true },
    { id: 2, name: "Running & Sprinting", streak: 3, done: true },
    { id: 3, name: "Reading (20 min)", streak: 12, done: false },
    { id: 4, name: "Meditation", streak: 0, done: false }
  ],
  es: [
    { id: 1, name: "Entrenamiento de Fuerza", streak: 5, done: true },
    { id: 2, name: "Carrera y Sprints", streak: 3, done: true },
    { id: 3, name: "Lectura (20 min)", streak: 12, done: false },
    { id: 4, name: "Meditación", streak: 0, done: false }
  ]
};

const UI_TEXT = {
  fr: {
    water: "EAU", steps: "PAS", stepgoal: "Obj: 10,000",
    progtitle: "PROGRESSION DU JOUR", addph: "Nouvelle habitude...", addbtn: "Ajouter",
    navWeek: "Semaine", navStats: "Stats", navTrophies: "Trophées", navSiri: "Siri",
    settitle: "Réglages", setdesc: "Vos données sont enregistrées localement sur votre iPhone.",
    resetbtn: "Réinitialiser les habitudes",
    streak: "jours de suite",
    trophies: [
      { b: "🥉", n: "Bronze", d: "3 jours consécutifs" },
      { b: "🥈", n: "Argent", d: "7 jours consécutifs" },
      { b: "🥇", n: "Or", d: "30 jours consécutifs" },
      { b: "🏆", n: "Légende", d: "Semaine 100% parfaite" }
    ],
    siri: "<h3>🎙️ Commandes Vocales Siri</h3><p>Vous pouvez ajouter vos habitudes à l'écran d'accueil iPhone et configurer des raccourcis automatiques.</p>"
  },
  en: {
    water: "WATER", steps: "STEPS", stepgoal: "Goal: 10,000",
    progtitle: "DAILY PROGRESS", addph: "New habit...", addbtn: "Add",
    navWeek: "Week", navStats: "Stats", navTrophies: "Trophies", navSiri: "Siri",
    settitle: "Settings", setdesc: "Your data is saved locally on your iPhone.",
    resetbtn: "Reset habits",
    streak: "days streak",
    trophies: [
      { b: "🥉", n: "Bronze", d: "3 days streak" },
      { b: "🥈", n: "Silver", d: "7 days streak" },
      { b: "🥇", n: "Gold", d: "30 days streak" },
      { b: "🏆", n: "Legend", d: "100% perfect week" }
    ],
    siri: "<h3>🎙️ Siri Voice Commands</h3><p>You can add your habits to your iPhone home screen and configure voice shortcuts.</p>"
  },
  es: {
    water: "AGUA", steps: "PASOS", stepgoal: "Meta: 10,000",
    progtitle: "PROGRESO DIARIO", addph: "Nuevo hábito...", addbtn: "Añadir",
    navWeek: "Semana", navStats: "Estadísticas", navTrophies: "Trofeos", navSiri: "Siri",
    settitle: "Ajustes", setdesc: "Tus datos se guardan localmente en tu iPhone.",
    resetbtn: "Restablecer hábitos",
    streak: "días seguidos",
    trophies: [
      { b: "🥉", n: "Bronce", d: "Racha de 3 días" },
      { b: "🥈", n: "Plata", d: "Racha de 7 días" },
      { b: "🥇", n: "Oro", d: "Racha de 30 días" },
      { b: "🏆", n: "Leyenda", d: "Semana 100% perfecta" }
    ],
    siri: "<h3>🎙️ Comandos de Siri</h3><p>Puedes añadir tus hábitos a la pantalla de inicio de tu iPhone y configurar atajos de voz.</p>"
  }
};

let lang = localStorage.getItem('sb_lang') || 'fr';
let theme = localStorage.getItem('sb_theme') || 'dark';
let habits = JSON.parse(localStorage.getItem('sb_habits_' + lang)) || DEFAULT_HABITS[lang];
let waterCl = parseInt(localStorage.getItem('sb_water') || '125');
let selectedDay = (new Date().getDay() + 6) % 7;

document.addEventListener('DOMContentLoaded', () => {
  applyTheme(theme);
  setLanguage(lang, false);
  renderDays();
  renderHabits();
  renderCalendar();
  renderDate();
});

function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('sb_theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '🌙' : '☀️';
  
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) {
    metaTheme.setAttribute('content', theme === 'dark' ? '#15161c' : '#f3f4f8');
  }
}

function toggleTheme() {
  applyTheme(theme === 'dark' ? 'light' : 'dark');
}

function setLanguage(l) {
  lang = l;
  localStorage.setItem('sb_lang', lang);

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById(`lang-${lang}`);
  if(activeBtn) activeBtn.classList.add('active');

  const savedHabits = localStorage.getItem('sb_habits_' + lang);
  if (savedHabits) {
    habits = JSON.parse(savedHabits);
  } else {
    habits = DEFAULT_HABITS[lang];
    localStorage.setItem('sb_habits_' + lang, JSON.stringify(habits));
  }

  const t = UI_TEXT[lang];
  document.getElementById('lbl-water').textContent = t.water;
  document.getElementById('lbl-steps').textContent = t.steps;
  document.getElementById('lbl-stepgoal').textContent = t.stepgoal;
  document.getElementById('lbl-progtitle').textContent = t.progtitle;
  document.getElementById('newHabitInp').placeholder = t.addph;
  document.getElementById('lbl-addbtn').textContent = t.addbtn;
  document.getElementById('nav-week').textContent = t.navWeek;
  document.getElementById('nav-stats').textContent = t.navStats;
  document.getElementById('nav-trophies').textContent = t.navTrophies;
  document.getElementById('nav-siri').textContent = t.navSiri;
  document.getElementById('lbl-settitle').textContent = t.settitle;
  document.getElementById('lbl-setdesc').textContent = t.setdesc;
  document.getElementById('lbl-resetbtn').textContent = t.resetbtn;
  document.getElementById('siriHelp').innerHTML = t.siri;

  renderTrophies();
  renderDays();
  renderHabits();
  renderDate();
}

function renderDate() {
  const localeMap = { fr: 'fr-FR', en: 'en-US', es: 'es-ES' };
  const options = { weekday: 'long', day: 'numeric', month: 'long' };
  const now = new Date().toLocaleDateString(localeMap[lang] || 'fr-FR', options);
  document.getElementById('dateDisplay').textContent = now.toUpperCase();
}

function renderDays() {
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  const days = DSHORT[lang];
  const todayIdx = (new Date().getDay() + 6) % 7;

  days.forEach((dayName, idx) => {
    const isToday = idx === todayIdx;
    const isSelected = idx === selectedDay;
    const fillHeight = isToday ? '75%' : (idx < todayIdx ? '100%' : '20%');

    const col = document.createElement('button');
    col.className = `day-col ${isSelected ? 'selected' : ''}`;
    col.onclick = () => { selectedDay = idx; renderDays(); };
    col.innerHTML = `
      <span class="day-name ${isToday ? 'today' : ''}">${dayName}</span>
      <div class="day-track">
        <div class="day-fill" style="height: ${fillHeight};"></div>
      </div>
    `;
    grid.appendChild(col);
  });
}

function renderHabits() {
  const container = document.getElementById('habitsList');
  container.innerHTML = '';
  let completed = 0;

  habits.forEach(h => {
    if (h.done) completed++;
    const row = document.createElement('div');
    row.className = 'habit-row';
    row.onclick = () => toggleHabit(h.id);
    row.innerHTML = `
      <div class="cbx ${h.done ? 'done' : ''}">${h.done ? '✓' : ''}</div>
      <div class="habit-mid">
        <div class="habit-name ${h.done ? 'done' : ''}">${h.name}</div>
        <div class="habit-sub">🔥 ${h.streak} ${UI_TEXT[lang].streak}</div>
      </div>
    `;
    container.appendChild(row);
  });

  const total = habits.length;
  const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('progText').textContent = `${completed}/${total} (${percent}%)`;
  document.getElementById('progBar').style.width = `${percent}%`;

  localStorage.setItem('sb_habits_' + lang, JSON.stringify(habits));
}

function toggleHabit(id) {
  habits = habits.map(h => {
    if (h.id === id) {
      const newDone = !h.done;
      return { ...h, done: newDone, streak: newDone ? h.streak + 1 : Math.max(0, h.streak - 1) };
    }
    return h;
  });
  renderHabits();
}

function addNewHabit() {
  const inp = document.getElementById('newHabitInp');
  const name = inp.value.trim();
  if (!name) return;

  habits.push({ id: Date.now(), name, streak: 0, done: false });
  inp.value = '';
  renderHabits();
}

function addWater(amount) {
  waterCl = Math.min(waterCl + amount, 250);
  localStorage.setItem('sb_water', waterCl.toString());
  document.getElementById('waterNum').textContent = (waterCl / 100).toFixed(2) + 'L';
  document.getElementById('waterFill').style.height = Math.round((waterCl / 250) * 100) + '%';
}

function renderTrophies() {
  const grid = document.getElementById('trophiesGrid');
  grid.innerHTML = '';
  UI_TEXT[lang].trophies.forEach(t => {
    const item = document.createElement('div');
    item.className = 'troph-card';
    item.innerHTML = `
      <div class="tb-badge">${t.b}</div>
      <div class="tb-name">${t.n}</div>
      <div class="tb-desc">${t.d}</div>
    `;
    grid.appendChild(item);
  });
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 31; i++) {
    const cell = document.createElement('div');
    cell.className = `calday ${[2, 3, 5, 8, 12, 14, 15, 19, 21, 22, 25, 28].includes(i) ? 'perfect' : ''}`;
    cell.textContent = i;
    grid.appendChild(cell);
  }
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hide'));
  document.querySelectorAll('.bbtab').forEach(el => el.classList.remove('on'));
  document.getElementById(`tab-${tabId}`).classList.remove('hide');
  btn.classList.add('on');
}

function openSettings() {
  document.getElementById('settingsOverlay').classList.remove('hide');
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.add('hide');
}
function resetData() {
  localStorage.removeItem('sb_habits_' + lang);
  habits = DEFAULT_HABITS[lang];
  renderHabits();
  closeSettings();
}
</script>
</body>
</html>
