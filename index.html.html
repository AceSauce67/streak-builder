<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<title>Streak Builder</title>

<meta name="theme-color" content="#15161c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Streak Builder"/>
<link rel="manifest" href="manifest.json"/>

<style>
:root {
  --bg1: #15161c;
  --bg2: #1b1c24;
  --card: #1e1f27;
  --surface: #262832;
  --surface2: #2a2c37;
  --form-bg: #22232c;
  --track: #2f313d;
  --line: #33353f;
  --ink: #f2f3f8;
  --sub: #a7adba;
  --faint: #7c8291;
  --cbx-border: #454956;
  --shadow: 0 10px 34px rgba(0,0,0,.4);
  --green: #16a34a;
  --green-soft: rgba(22, 163, 74, 0.25);
  --amber: #f59e0b;
  --danger: #f87171;
  --accent: #635bff;
  --accent-light: #8b85ff;
  --accent-soft: rgba(99, 91, 255, 0.25);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  background-color: var(--bg1);
  background: linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment: fixed;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  overflow-x: hidden;
}

.app-container {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 16px);
}

h1, h2, h3 { margin: 0; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.brandtitle {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: .12em;
  color: var(--ink);
}
.datesub {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--accent-light);
  margin-top: 3px;
  text-transform: uppercase;
}

.head-actions {
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: .15s;
}
.icon-btn:active { transform: scale(.92); }

.lang-selector {
  display: flex;
  background: var(--surface2);
  padding: 3px;
  border-radius: 12px;
  gap: 2px;
  margin-bottom: 16px;
}
.lang-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--sub);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 0;
  border-radius: 9px;
  cursor: pointer;
  transition: .2s;
}
.lang-btn.active {
  background: var(--accent);
  color: #fff;
}

.days-grid {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}
.day-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 0;
}
.day-name {
  font-size: 11px;
  font-weight: 800;
  color: var(--faint);
  text-transform: uppercase;
}
.day-name.today { color: var(--accent-light); }
.day-track {
  position: relative;
  width: 100%;
  height: 76px;
  border-radius: 12px;
  background: var(--track);
  overflow: hidden;
}
.day-col.selected .day-track {
  outline: 2px solid var(--accent);
}
.day-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, var(--accent-light), var(--accent));
  border-radius: 12px;
  transition: height .3s ease;
}

.health-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}
.health-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
}
.health-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .05em;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-bottom: 10px;
}

.watergauge {
  position: relative;
  width: 50px;
  height: 72px;
  margin: 0 auto;
  border-radius: 14px;
  background: var(--track);
  overflow: hidden;
  border: 1px solid var(--line);
}
.waterfill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #38bdf8, #0284c7);
  transition: height .4s ease;
}
.waternum {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--ink);
}

.wbtns {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-top: 10px;
}
.wbtn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  padding: 5px 7px;
  cursor: pointer;
}
.wbtn:active { border-color: var(--accent); color: var(--accent-light); }

.ringwrap {
  position: relative;
  width: 72px;
  height: 72px;
  margin: 0 auto;
}
.ring { width: 72px; height: 72px; transform: rotate(-90deg); }
.ringbg { fill: none; stroke: var(--track); stroke-width: 7; }
.ringfg { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ringnum {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}

.progress-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 18px;
}
.progress-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.progress-bar-bg {
  background: var(--track);
  height: 8px;
  border-radius: 8px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), #22c55e);
  border-radius: 8px;
  transition: width .4s ease;
}

.habit-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.habit-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  transition: .15s;
  cursor: pointer;
}
.habit-row:active { transform: scale(.98); }
.cbx {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 2px solid var(--cbx-border);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  flex-shrink: 0;
  font-weight: bold;
}
.cbx.done {
  background: var(--habit-color, var(--green));
  border-color: var(--habit-color, var(--green));
  color: #fff;
}
.habit-mid { flex: 1; min-width: 0; }
.habit-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.habit-name.done {
  text-decoration: line-through;
  color: var(--faint);
}
.habit-sub {
  font-size: 11px;
  color: var(--amber);
  font-weight: 700;
  margin-top: 2px;
}
.habit-goal-tag {
  font-size: 10px;
  color: var(--sub);
  background: var(--surface2);
  padding: 2px 6px;
  border-radius: 6px;
  margin-left: 6px;
}

/* Formulaire d'ajout d'habitude identique à l'image */
.add-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  margin-top: 16px;
}
.add-inp {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 14px;
  background: var(--card);
  color: var(--ink);
  outline: none;
  margin-bottom: 14px;
}
.add-inp:focus { border-color: var(--green); }

.freq-label {
  font-size: 12px;
  color: var(--sub);
  font-weight: 600;
  margin-bottom: 8px;
}

.freq-days-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.form-day-btn {
  flex: 1;
  height: 38px;
  border-radius: 12px;
  border: none;
  background: var(--surface2);
  color: var(--sub);
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.form-day-btn.selected {
  background: var(--green);
  color: #ffffff;
}

.freq-presets-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.preset-btn {
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--sub);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.preset-btn:active, .preset-btn.selected {
  background: var(--surface2);
  color: var(--ink);
}

/* Palette de couleurs */
.color-picker-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.color-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s;
}
.color-dot:active { transform: scale(0.9); }
.color-dot.selected {
  outline: 2px solid #ffffff;
  outline-offset: 2px;
  transform: scale(1.1);
}

/* Objectif (min) */
.goal-row {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.goal-btn {
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--sub);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.goal-btn.selected {
  background: var(--green);
  color: #ffffff;
  border-color: var(--green);
}

/* Bouton d'ajout aligné à droite */
.add-action-row {
  display: flex;
  justify-content: flex-end;
}
.add-btn-green {
  border: none;
  background: var(--green);
  color: #ffffff;
  border-radius: 14px;
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 4px 12px var(--green-soft);
}
.add-btn-green:active { transform: scale(0.96); }

.bottombar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 12px);
  width: calc(100% - 32px);
  max-width: 460px;
  display: flex;
  gap: 4px;
  padding: 6px;
  border-radius: 22px;
  z-index: 40;
  background: rgba(30, 31, 39, 0.85);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.4);
}

.bbtab {
  flex: 1;
  border: none;
  cursor: pointer;
  padding: 8px 4px;
  border-radius: 16px;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: transparent;
  color: var(--sub);
  transition: .18s;
}
.bbtab.on {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 14px var(--accent-soft);
}

.troph-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.troph-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
}
.tb-badge { font-size: 28px; margin-bottom: 6px; }
.tb-name { font-size: 13px; font-weight: 700; color: var(--ink); }
.tb-desc { font-size: 11px; color: var(--faint); margin-top: 2px; }

.calgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.calday {
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--sub);
}
.calday.perfect {
  border: 2px solid var(--amber);
  color: var(--ink);
  background: rgba(245, 158, 11, 0.15);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 24px;
  width: 100%;
  max-width: 380px;
}

.hide { display: none !important; }
</style>
</head>
<body>

<div class="app-container">
  <div class="card">
    <!-- Header -->
    <div class="head">
      <div>
        <h1 class="brandtitle">STREAK BUILDER</h1>
        <div class="datesub" id="dateDisplay">--</div>
      </div>
      <div class="head-actions">
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
      </div>
    </div>

    <!-- Language Selector -->
    <div class="lang-selector">
      <button class="lang-btn" id="lang-fr" onclick="setLanguage('fr')">FR</button>
      <button class="lang-btn" id="lang-en" onclick="setLanguage('en')">EN</button>
      <button class="lang-btn" id="lang-es" onclick="setLanguage('es')">ES</button>
    </div>

    <!-- Days Selector Header -->
    <div class="days-grid" id="daysGrid"></div>

    <!-- Main Tab: Week -->
    <div id="tab-week" class="tab-content">
      <!-- Health Module -->
      <div class="health-grid">
        <div class="health-card">
          <div class="health-title">💧 <span id="lbl-water">EAU</span></div>
          <div class="watergauge">
            <div class="waterfill" id="waterFill" style="height: 50%;"></div>
            <div class="waternum" id="waterNum">1.25L</div>
          </div>
          <div class="wbtns">
            <button class="wbtn" onclick="addWater(25)">+25cl</button>
            <button class="wbtn" onclick="addWater(50)">+50cl</button>
            <button class="wbtn" onclick="addWater(100)">+1L</button>
          </div>
        </div>

        <div class="health-card">
          <div class="health-title">👟 <span id="lbl-steps">PAS</span></div>
          <div class="ringwrap">
            <svg class="ring" viewBox="0 0 36 36">
              <path class="ringbg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
              <path class="ringfg" id="stepRing" stroke-dasharray="84, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <div class="ringnum" id="stepNum">8.4k</div>
          </div>
          <div style="font-size:10px; color:var(--faint); margin-top:8px; font-weight:700;" id="lbl-stepgoal">Obj: 10,000</div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-panel">
        <div class="progress-head">
          <span id="lbl-progtitle">PROGRESSION DU JOUR</span>
          <span id="progText" style="color:var(--green);">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progBar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Habits List -->
      <div class="habit-list" id="habitsList"></div>

      <!-- Module d'ajout exact à l'image -->
      <div class="add-card">
        <input type="text" class="add-inp" id="newHabitInp" placeholder="Ajouter une habitude..." />

        <!-- Quels jours ? -->
        <div class="freq-label" id="lbl-whichdays">Quels jours ?</div>
        <div class="freq-days-row" id="formDaysGrid"></div>
        <div class="freq-presets-row">
          <button class="preset-btn" id="btn-freq-every" onclick="selectPreset('every')">Tous les jours</button>
          <button class="preset-btn" id="btn-freq-weekdays" onclick="selectPreset('weekdays')">En semaine</button>
          <button class="preset-btn" id="btn-freq-weekends" onclick="selectPreset('weekends')">Week-end</button>
        </div>

        <!-- Couleur -->
        <div class="freq-label" id="lbl-color">Couleur</div>
        <div class="color-picker-row" id="colorPicker"></div>

        <!-- Objectif (min) -->
        <div class="freq-label" id="lbl-goal">Objectif (min)</div>
        <div class="goal-row" id="goalGrid"></div>

        <!-- Bouton + Ajouter -->
        <div class="add-action-row">
          <button class="add-btn-green" onclick="addNewHabit()" id="lbl-addbtn">+ Ajouter</button>
        </div>
      </div>
    </div>

    <!-- Stats Tab -->
    <div id="tab-stats" class="tab-content hide">
      <h3 style="font-size:14px; font-weight:800; margin-bottom:12px; color:var(--ink);" id="calTitle">CALENDRIER</h3>
      <div class="calgrid" id="calGrid"></div>
    </div>

    <!-- Trophies Tab -->
    <div id="tab-trophies" class="tab-content hide">
      <div class="troph-grid" id="trophiesGrid"></div>
    </div>

    <!-- Siri Tab -->
    <div id="tab-siri" class="tab-content hide">
      <div style="font-size:13px; line-height:1.5; color:var(--sub);" id="siriHelp"></div>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottombar">
  <button class="bbtab on" onclick="switchTab('week', this)"><span>📅</span><span id="nav-week">Semaine</span></button>
  <button class="bbtab" onclick="switchTab('stats', this)"><span>📊</span><span id="nav-stats">Stats</span></button>
  <button class="bbtab" onclick="switchTab('trophies', this)"><span>🏆</span><span id="nav-trophies">Trophées</span></button>
  <button class="bbtab" onclick="switchTab('siri', this)"><span>🎙️</span><span id="nav-siri">Siri</span></button>
</nav>

<!-- Modal Settings -->
<div class="modal-overlay hide" id="settingsOverlay">
  <div class="modal-box">
    <h3 style="margin-top:0; color:var(--ink);" id="lbl-settitle">Réglages</h3>
    <p style="font-size:13px; color:var(--sub); line-height:1.4;" id="lbl-setdesc">
      Vos données sont enregistrées localement sur votre iPhone.
    </p>
    <button onclick="resetData()" style="border:none; background:var(--danger); color:#fff; padding:10px; width:100%; border-radius:12px; font-weight:700; cursor:pointer; margin-bottom:10px;" id="lbl-resetbtn">
      Réinitialiser les habitudes
    </button>
    <button onclick="closeSettings()" style="border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:10px; width:100%; border-radius:12px; font-weight:700; cursor:pointer;">
      Fermer
    </button>
  </div>
</div>

<script>
const DSHORT = {
  fr: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
  en: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
  es: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom']
};

const FORM_DAYS = {
  fr: ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'],
  en: ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'],
  es: ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá', 'Do']
};

const PALETTE = [
  '#6366f1', '#3b82f6', '#06b6d4', '#14b8a6', '#10b981', 
  '#16a34a', '#f59e0b', '#f97316', '#ef4444', '#ec4899'
];

const GOAL_OPTIONS = ['Aucun', 5, 10, 15, 20, 30, 45, 60];

const DEFAULT_HABITS = {
  fr: [
    { id: 1, name: "Musculation & Force", streak: 5, done: true, color: '#16a34a', goal: 'Aucun' },
    { id: 2, name: "Course & Sprint", streak: 3, done: true, color: '#3b82f6', goal: 20 },
    { id: 3, name: "Lecture", streak: 12, done: false, color: '#f59e0b', goal: 20 },
    { id: 4, name: "Méditation", streak: 0, done: false, color: '#6366f1', goal: 10 }
  ],
  en: [
    { id: 1, name: "Strength Training", streak: 5, done: true, color: '#16a34a', goal: 'None' },
    { id: 2, name: "Running & Sprinting", streak: 3, done: true, color: '#3b82f6', goal: 20 },
    { id: 3, name: "Reading", streak: 12, done: false, color: '#f59e0b', goal: 20 },
    { id: 4, name: "Meditation", streak: 0, done: false, color: '#6366f1', goal: 10 }
  ],
  es: [

};

    whichDays: "Which days?",
    freqEvery: "Every day",
    freqWeekdays: "Weekdays",
    freqWeekends: "Weekends",
    colorLabel: "Color",
    goalLabel: "Goal (min)",
    noneGoal: "None",
    navWeek: "Week", navStats: "Stats", navTrophies: "Trophies", navSiri: "Siri",
    settitle: "Settings", setdesc: "Your data is saved locally on your iPhone.",
    resetbtn: "Reset habits",
    streak: "days streak",
    trophies: [
      { b: "🥉", n: "Bronze", d: "3 days streak" },

    ],

  es: {

    freqEvery: "Todos los días",

    colorLabel: "Color",

    noneGoal: "Ninguno",
    navWeek: "Semana", navStats: "Estadísticas", navTrophies: "Trofeos", navSiri: "Siri",
    settitle: "Ajustes", setdesc: "Tus datos se guardan localmente en tu iPhone.",

    streak: "días seguidos",

      { b: "🥉", n: "Bronce", d: "Racha de 3 días" },

  }
};

let lang = localStorage.getItem('sb_lang') || 'fr';
let habits = JSON.parse(localStorage.getItem('sb_habits_' + lang)) || DEFAULT_HABITS[lang];
let waterCl = parseInt(localStorage.getItem('sb_water') || '125');
let selectedDay = (new Date().getDay() + 6) % 7;
let selectedFormDays = [true, true, true, true, true, true, true];
let selectedColor = '#16a34a';
let selectedGoal = 'Aucun';

document.addEventListener('DOMContentLoaded', () => {
  setLanguage(lang, false);
  renderDays();
  renderHabits();
  renderCalendar();
  renderDate();
});

function setLanguage(l) {
  lang = l;
  localStorage.setItem('sb_lang', lang);

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById(`lang-${lang}`);
  if(activeBtn) activeBtn.classList.add('active');

  const savedHabits = localStorage.getItem('sb_habits_' + lang);
  if (savedHabits) {
    habits = JSON.parse(savedHabits);
  } else {
    habits = DEFAULT_HABITS[lang];
    localStorage.setItem('sb_habits_' + lang, JSON.stringify(habits));
  }

  const t = UI_TEXT[lang];
  document.getElementById('lbl-water').textContent = t.water;
  document.getElementById('lbl-steps').textContent = t.steps;
  document.getElementById('lbl-stepgoal').textContent = t.stepgoal;
  document.getElementById('lbl-progtitle').textContent = t.progtitle;
  document.getElementById('newHabitInp').placeholder = t.addph;
  document.getElementById('lbl-addbtn').textContent = t.addbtn;
  document.getElementById('lbl-whichdays').textContent = t.whichDays;
  document.getElementById('btn-freq-every').textContent = t.freqEvery;
  document.getElementById('btn-freq-weekdays').textContent = t.freqWeekdays;
  document.getElementById('btn-freq-weekends').textContent = t.freqWeekends;
  document.getElementById('lbl-color').textContent = t.colorLabel;
  document.getElementById('lbl-goal').textContent = t.goalLabel;
  document.getElementById('nav-week').textContent = t.navWeek;
  document.getElementById('nav-stats').textContent = t.navStats;
  document.getElementById('nav-trophies').textContent = t.navTrophies;
  document.getElementById('nav-siri').textContent = t.navSiri;
  document.getElementById('lbl-settitle').textContent = t.settitle;
  document.getElementById('lbl-setdesc').textContent = t.setdesc;
  document.getElementById('lbl-resetbtn').textContent = t.resetbtn;
  document.getElementById('siriHelp').innerHTML = t.siri;

  renderFormDays();
  renderColors();
  renderGoals();
  renderTrophies();
  renderDays();
  renderHabits();
  renderDate();
}

function renderFormDays() {
  const grid = document.getElementById('formDaysGrid');
  grid.innerHTML = '';
  const days = FORM_DAYS[lang];
  days.forEach((dayName, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `form-day-btn ${selectedFormDays[idx] ? 'selected' : ''}`;
    btn.textContent = dayName;
    btn.onclick = () => {
      selectedFormDays[idx] = !selectedFormDays[idx];
      renderFormDays();
    };
    grid.appendChild(btn);
  });
}

function renderColors() {
  const container = document.getElementById('colorPicker');
  container.innerHTML = '';
  PALETTE.forEach(c => {
    const dot = document.createElement('div');
    dot.className = `color-dot ${selectedColor === c ? 'selected' : ''}`;
    dot.style.backgroundColor = c;
    dot.onclick = () => {
      selectedColor = c;
      renderColors();
    };
    container.appendChild(dot);
  });
}

function renderGoals() {
  const container = document.getElementById('goalGrid');
  container.innerHTML = '';
  GOAL_OPTIONS.forEach(g => {
    const label = g === 'Aucun' ? UI_TEXT[lang].noneGoal : g;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `goal-btn ${selectedGoal === g ? 'selected' : ''}`;
    btn.textContent = label;
    btn.onclick = () => {
      selectedGoal = g;
      renderGoals();
    };
    container.appendChild(btn);
  });
}

function selectPreset(type) {
  if (type === 'every') {
    selectedFormDays = [true, true, true, true, true, true, true];
  } else if (type === 'weekdays') {
    selectedFormDays = [true, true, true, true, true, false, false];
  } else if (type === 'weekends') {
    selectedFormDays = [false, false, false, false, false, true, true];
  }
  renderFormDays();
}

function renderDate() {
  const localeMap = { fr: 'fr-FR', en: 'en-US', es: 'es-ES' };
  const options = { weekday: 'long', day: 'numeric', month: 'long' };
  const now = new Date().toLocaleDateString(localeMap[lang] || 'fr-FR', options);
  document.getElementById('dateDisplay').textContent = now.toUpperCase();
}

function renderDays() {
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  const days = DSHORT[lang];
  const todayIdx = (new Date().getDay() + 6) % 7;

  days.forEach((dayName, idx) => {
    const isToday = idx === todayIdx;
    const isSelected = idx === selectedDay;
    const fillHeight = isToday ? '75%' : (idx < todayIdx ? '100%' : '20%');

    const col = document.createElement('button');
    col.className = `day-col ${isSelected ? 'selected' : ''}`;
    col.onclick = () => { selectedDay = idx; renderDays(); };
    col.innerHTML = `
      <span class="day-name ${isToday ? 'today' : ''}">${dayName}</span>
      <div class="day-track">
        <div class="day-fill" style="height: ${fillHeight};"></div>
      </div>
    `;
    grid.appendChild(col);
  });
}

function renderHabits() {
  const container = document.getElementById('habitsList');
  container.innerHTML = '';
  let completed = 0;

  habits.forEach(h => {
    if (h.done) completed++;
    const row = document.createElement('div');
    row.className = 'habit-row';
    row.style.setProperty('--habit-color', h.color || '#16a34a');
    row.onclick = () => toggleHabit(h.id);

    const goalDisplay = (h.goal && h.goal !== 'Aucun' && h.goal !== 'None' && h.goal !== 'Ninguno') ? `<span class="habit-goal-tag">⏱ ${h.goal} min</span>` : '';

    row.innerHTML = `
      <div class="cbx ${h.done ? 'done' : ''}">${h.done ? '✓' : ''}</div>
      <div class="habit-mid">
        <div class="habit-name ${h.done ? 'done' : ''}">${h.name} ${goalDisplay}</div>
        <div class="habit-sub">🔥 ${h.streak} ${UI_TEXT[lang].streak}</div>
      </div>
    `;
    container.appendChild(row);
  });

  const total = habits.length;
  const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('progText').textContent = `${completed}/${total} (${percent}%)`;
  document.getElementById('progBar').style.width = `${percent}%`;

  localStorage.setItem('sb_habits_' + lang, JSON.stringify(habits));
}

function toggleHabit(id) {
  habits = habits.map(h => {
    if (h.id === id) {
      const newDone = !h.done;
      return { ...h, done: newDone, streak: newDone ? h.streak + 1 : Math.max(0, h.streak - 1) };
    }
    return h;
  });
  renderHabits();
}

function addNewHabit() {
  const inp = document.getElementById('newHabitInp');
  const name = inp.value.trim();
  if (!name) return;

  habits.push({ 
    id: Date.now(), 
    name, 
    streak: 0, 
    done: false, 
    days: [...selectedFormDays],
    color: selectedColor,
    goal: selectedGoal
  });

  inp.value = '';
  renderHabits();
}

function addWater(amount) {
  waterCl = Math.min(waterCl + amount, 250);
  localStorage.setItem('sb_water', waterCl.toString());
  document.getElementById('waterNum').textContent = (waterCl / 100).toFixed(2) + 'L';
  document.getElementById('waterFill').style.height = Math.round((waterCl / 250) * 100) + '%';
}

function renderTrophies() {
  const grid = document.getElementById('trophiesGrid');
  grid.innerHTML = '';
  UI_TEXT[lang].trophies.forEach(t => {
    const item = document.createElement('div');
    item.className = 'troph-card';
    item.innerHTML = `
      <div class="tb-badge">${t.b}</div>
      <div class="tb-name">${t.n}</div>
      <div class="tb-desc">${t.d}</div>
    `;
    grid.appendChild(item);
  });
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 31; i++) {
    const cell = document.createElement('div');
    cell.className = `calday ${[2, 3, 5, 8, 12, 14, 15, 19, 21, 22, 25, 28].includes(i) ? 'perfect' : ''}`;
    cell.textContent = i;
    grid.appendChild(cell);
  }
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hide'));
  document.querySelectorAll('.bbtab').forEach(el => el.classList.remove('on'));
  document.getElementById(`tab-${tabId}`).classList.remove('hide');
  btn.classList.add('on');
}

function openSettings() {
  document.getElementById('settingsOverlay').classList.remove('hide');
}
function closeSettings() {
  document.getElementById('settingsOverlay').classList.add('hide');
}
function resetData() {
  localStorage.removeItem('sb_habits_' + lang);
  habits = DEFAULT_HABITS[lang];
  renderHabits();
  closeSettings();
}
</script>
