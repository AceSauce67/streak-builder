<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Streak Builder — aperçu</title>
<style>
:root{
  --bg1:#f3f4f8; --bg2:#edeef6;
  --card:#ffffff; --surface:#f7f8fb; --surface2:#f1f2f7; --form-bg:#fafbfd;
  --track:#eef0f5; --bartrack:#eceef3; --tab-on:#ffffff;
  --line:#e6e8ee; --line-soft:#f0f1f5;
  --ink:#111827; --sub:#6b7280; --faint:#9ca3af; --faint2:#d4d7de;
  --inp-bg:#ffffff; --row-active:#f4f5f8; --cbx-border:#d3d7e0;
  --shadow:0 10px 34px rgba(24,28,45,.07);
  --green:#22c55e; --amber:#f59e0b; --danger:#ef4444;
  --accent:#6d5cf0; --accent-light:#9b8bff; --accent-soft:#efedff;
}
[data-theme="dark"]{
  --bg1:#15161c; --bg2:#1b1c24;
  --card:#1e1f27; --surface:#262832; --surface2:#2a2c37; --form-bg:#22232c;
  --track:#2f313d; --bartrack:#2f313d; --tab-on:#383a46;
  --line:#33353f; --line-soft:#2a2c34;
  --ink:#f2f3f8; --sub:#a7adba; --faint:#7c8291; --faint2:#4b4e5a;
  --inp-bg:#262832; --row-active:#2a2c37; --cbx-border:#454956;
  --shadow:0 10px 34px rgba(0,0,0,.4);
  --danger:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100vh; transition:background .3s;
  padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px);
}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:17px;font-weight:700}
.card{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:background .3s,border-color .3s}
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.sub{margin:3px 0 0;font-size:13.5px;color:var(--sub)}
.muted{color:var(--sub)} .faint{color:var(--faint)} .strong{font-weight:700}
.ink{color:var(--ink)} .accentc{color:var(--accent)} .amber{color:var(--amber)}

.hactions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.gear{width:38px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--sub);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;padding:0}
.gear.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.gear svg{width:18px;height:18px}
.tabs{display:flex;background:var(--surface2);padding:4px;border-radius:13px;gap:4px;min-width:210px}
.tab{flex:1;border:none;cursor:pointer;padding:9px 12px;border-radius:11px;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s;background:transparent;color:var(--sub);font-family:inherit}
.tab.on{background:var(--tab-on);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.10)}
.tab svg{width:16px;height:16px}

.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow + .setrow{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft)}
.setrow .lbl{font-size:14px;font-weight:600}
.accents{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:none;padding:0;transition:transform .12s}
.sw:active{transform:scale(.9)}
.switch{width:48px;height:28px;border-radius:20px;background:var(--track);border:none;cursor:pointer;position:relative;transition:.2s;padding:0}
.switch.on{background:var(--accent)}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on .knob{left:23px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:16px}
.panelhead{display:flex;justify-content:space-between;margin-bottom:9px;font-size:13px;color:var(--sub);font-weight:600}
.bar{background:var(--bartrack);overflow:hidden;width:100%}
.fill{height:100%;transition:width .45s cubic-bezier(.4,0,.2,1)}

.days{display:flex;gap:6px;margin-bottom:20px}
.daycol{border:none;background:transparent;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.dlabel{font-size:11.5px;font-weight:700;color:var(--faint)}
.dlabel.act{color:var(--accent)} .dlabel.today{color:var(--ink)}
.track{position:relative;width:100%;max-width:34px;height:88px;border-radius:11px;background:var(--track);overflow:hidden;transition:.2s}
.track.sel{box-shadow:0 0 0 2px var(--accent)}
.tfill{position:absolute;left:0;right:0;bottom:0;border-radius:11px;background:linear-gradient(180deg,var(--accent-light),var(--accent));transition:height .45s cubic-bezier(.4,0,.2,1)}
.dcount{font-size:11px;color:var(--faint);font-weight:600}

.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.chip{margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:20px}

.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle;flex-shrink:0}

.list{margin:0 -4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:13px;transition:background .15s}
.row:active{background:var(--row-active)}
@media(hover:hover){.row:hover{background:var(--surface)}}
.cbx{width:28px;height:28px;border-radius:8px;border:2px solid var(--cbx-border);cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;background:var(--inp-bg);transition:.18s;padding:0}
.cbx svg{width:17px;height:17px;color:#fff}
.rmid{flex:1;min-width:0}
.rname{font-size:15px;font-weight:600}
.rname.done{color:var(--faint);text-decoration:line-through}
.rsub{font-size:12px;color:var(--faint);margin-top:1px}
.acts{display:flex;gap:4px;opacity:1;transition:opacity .15s}
@media(hover:hover){.acts{opacity:0}.row:hover .acts{opacity:1}}
.ibtn{border:none;background:transparent;cursor:pointer;width:34px;height:34px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;color:var(--faint);transition:.15s;padding:0}
.ibtn:active{background:var(--surface)}
.ibtn.ok{color:var(--green)}
.ibtn svg{width:17px;height:17px}

.rest{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--faint);padding:28px 0;font-size:14px;text-align:center}
.rest svg{width:26px;height:26px}

.form{border:1px solid var(--line);background:var(--form-bg);border-radius:14px;padding:14px;margin-top:14px}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;color:var(--ink);
  background:var(--inp-bg);transition:.15s;font-family:inherit}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
.flabel{font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:7px}
.formrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.picker{display:flex;gap:5px;flex-wrap:wrap}
.pday{width:38px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--inp-bg);color:var(--faint);
  cursor:pointer;font-size:11.5px;font-weight:700;transition:.15s;font-family:inherit}
.pday.on{border:2px solid var(--accent);background:var(--accent);color:#fff}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{border:1px solid var(--line);background:var(--inp-bg);color:var(--sub);border-radius:20px;font-size:12px;font-weight:600;
  padding:5px 11px;cursor:pointer;transition:.15s;font-family:inherit}
.preset:active{border-color:var(--accent);color:var(--accent)}
.hswatches{display:flex;gap:8px;flex-wrap:wrap}
.hsw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:none;padding:0;transition:transform .12s}
.hsw:active{transform:scale(.88)}
.addrow{display:flex;justify-content:flex-end;margin-top:13px}
.add{border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-size:14px;
  padding:10px 16px;display:flex;align-items:center;gap:6px;transition:.15s;font-family:inherit}
.add:active{filter:brightness(.94)}
.add:disabled{opacity:.45}
.add svg{width:17px;height:17px}

.resetline{margin-top:16px;text-align:right;font-size:13px;color:var(--sub)}
.lnk{border:none;background:none;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;color:var(--sub)}
.lnk.danger{color:var(--danger);font-weight:700}
.lnk.faint{color:var(--faint)}
.lnk svg{width:14px;height:14px}

.summary{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.slabel{font-size:12px;color:var(--sub);font-weight:600}
.sval{font-size:26px;font-weight:800;margin:2px 0 8px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.sunit{font-size:14px;color:var(--faint);font-weight:600}
.sfoot{font-size:12px;color:var(--faint)}
.fi{display:inline-flex}.fi svg{width:20px;height:20px}

.hrow{padding:14px 0;border-top:1px solid var(--line-soft)}
.hrhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:10px}
.hname{font-size:15px;font-weight:700}
.hright{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:13px}
.streak{font-size:12px;font-weight:700;color:var(--amber);display:inline-flex;align-items:center;gap:3px}
.streak .fi svg{width:13px;height:13px}
.hsched{font-size:11.5px;color:var(--faint);margin-bottom:9px}
.hbody{display:flex;align-items:center;gap:12px}
.strip{display:flex;gap:5px}
.cell{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid transparent}
.cell svg{width:13px;height:13px;color:#fff}
.cell.sch{background:var(--inp-bg);color:var(--faint);border:1.5px solid var(--line)}
.cell.off{background:transparent;color:var(--faint2)}
.cell.td.sch{border:2px solid var(--accent)}
.cell.td.off{border:2px solid var(--line)}
.hpct{font-size:13px;font-weight:700;width:40px;text-align:right}

@media(max-width:560px){.card{padding:16px}.track{height:72px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- sync-specific additions ---- */
.setup{max-width:460px;margin:0 auto}
.setup h1{margin-bottom:6px}
.setup p{font-size:14px;color:var(--sub);line-height:1.5;margin:0 0 16px}
.setup .field{margin-bottom:14px}
.setup .field label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:6px}
.setup .row2{display:flex;gap:8px}
.setup .row2 .inp{flex:1}
.syncbar{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);margin-top:14px;justify-content:flex-end}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.syncdot.ok{background:var(--green)}
.syncdot.busy{background:var(--amber)}
.syncdot.err{background:var(--danger)}
.ghost{border:1px solid var(--line);background:var(--inp-bg);color:var(--sub);border-radius:10px;font-size:13px;font-weight:600;padding:9px 13px;cursor:pointer;font-family:inherit}
.ghost:active{filter:brightness(.96)}
.tokbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.banner{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{border:none;background:var(--accent);color:#fff;border-radius:8px;font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer;font-family:inherit}

/* ---- brand logo header ---- */
.brand{display:flex;justify-content:center;margin:2px 0 14px}
.logo{width:62%;max-width:280px;height:auto;display:block}

/* ===== Bloc 1 : profil, barre du bas glassy, citation ===== */
.card{margin-bottom:150px}
.profile{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:.15s}
.profile.on{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 4px 14px var(--accent-soft)}
.profile svg{width:20px;height:20px}
.langs{display:flex;gap:5px;background:var(--surface2);padding:3px;border-radius:11px}
.langbtn{border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:700;color:var(--sub);padding:6px 10px;border-radius:8px;font-family:inherit;transition:.15s}
.langbtn.on{background:var(--accent);color:#fff}

.quotepill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 80px);
  width:calc(100% - 40px);max-width:440px;z-index:39;padding:9px 16px;border-radius:16px;font-size:12.5px;line-height:1.35;
  color:var(--ink);text-align:center;font-style:italic;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 24px rgba(20,22,40,.12)}
.quotepill::before{content:"\201C"} .quotepill::after{content:"\201D"}
[data-theme="dark"] .quotepill{background:rgba(30,31,39,.5);border-color:rgba(255,255,255,.1);color:var(--sub)}

.bottombar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
  width:calc(100% - 28px);max-width:460px;display:flex;gap:6px;padding:7px;border-radius:22px;z-index:40;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 34px rgba(20,22,40,.18)}
[data-theme="dark"] .bottombar{background:rgba(28,29,37,.6);border-color:rgba(255,255,255,.12);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.bbtab{flex:1;border:none;cursor:pointer;padding:11px;border-radius:15px;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;color:var(--sub);font-family:inherit;transition:.18s}
.bbtab.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-soft)}
.bbtab svg{width:17px;height:17px}

/* ===== Bloc 3 : bouton micro + toast ===== */
.micbtn{flex:0 0 auto;width:48px;border:none;cursor:pointer;border-radius:15px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:inherit;box-shadow:0 4px 14px var(--accent-soft);transition:.18s}
.micbtn:active{filter:brightness(.94)}
.micbtn svg{width:19px;height:19px}
.micbtn.listening{animation:sbpulse 1.1s ease-in-out infinite}
@keyframes sbpulse{0%{box-shadow:0 0 0 0 rgba(0,0,0,.001);transform:scale(1)}
  50%{box-shadow:0 0 0 12px transparent;transform:scale(1.08)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,.001);transform:scale(1)}}
.sb-toast{position:fixed;left:50%;transform:translateX(-50%) translateY(18px);bottom:calc(env(safe-area-inset-bottom) + 152px);
  z-index:60;max-width:88%;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;color:#fff;background:#333;
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sb-toast.ok{background:var(--green)} .sb-toast.err{background:#ef4444} .sb-toast.info{background:var(--accent)}
@media(prefers-reduced-motion:reduce){.micbtn.listening{animation:none}}

/* ===== Bloc 4 : trophées + confettis ===== */
.sb-confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
@keyframes sbfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.troph-hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.th-flame{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ff9d3c,#f5580b);color:#fff;flex-shrink:0}
.th-flame svg{width:26px;height:26px}
.th-num{font-size:30px;font-weight:800;color:var(--ink);line-height:1}
.th-days{font-size:14px;font-weight:600;color:var(--faint)}
.th-best{font-size:12.5px;color:var(--sub);margin-top:4px}
.troph-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.troph-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;opacity:.68;transition:.2s}
.troph-card.got{opacity:1}
.tb-badge{width:54px;height:54px;border-radius:16px;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;background:var(--track);color:var(--faint)}
.tb-badge svg{width:27px;height:27px}
.tb-name{font-size:14px;font-weight:700;color:var(--ink)}
.tb-desc{font-size:11.5px;color:var(--faint);margin:2px 0 9px;min-height:30px;line-height:1.3}
.tb-bar{height:7px;border-radius:7px;background:var(--bartrack);overflow:hidden}
.tb-fill{height:100%;border-radius:7px;transition:width .5s}
.tb-prog{font-size:11px;color:var(--faint);margin-top:5px;font-weight:600}
.tb-unlocked{font-size:12px;font-weight:700;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px}
.tb-unlocked svg{width:13px;height:13px}
@media(max-width:400px){.bbtab{font-size:11.5px;padding:10px 5px;gap:5px}.bbtab svg{width:15px;height:15px}}

/* ===== Restructure UI : header titre+date, 5 onglets, tuto ===== */
.brandwrap{min-width:0}
.brandtitle{margin:0;font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.datesub{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);margin-top:3px}
.bottombar{gap:2px;padding:6px}
.bbtab{flex:1;flex-direction:column;gap:3px;padding:8px 3px;border-radius:14px;min-width:0}
.bbtab .bbic{display:flex} .bbtab svg{width:20px;height:20px}
.bblab{font-size:9.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tuto{padding:2px}
.tuto-h{margin:2px 0 6px;font-size:17px;font-weight:700;color:var(--ink)}
.tuto-p{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.4}
.tuto-ol{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.tuto-ol li{font-size:13px;color:var(--ink);line-height:1.4}
.urlbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);line-height:1.5}
.tuto-copy{margin:12px 0 0;width:100%;justify-content:center}
.tuto-note{font-size:11.5px;color:var(--faint);margin:12px 0 0;line-height:1.4}

/* ===== Habitudes chronométrées (minutes) ===== */
.goaltag{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:20px;margin-left:5px;vertical-align:middle}
.minrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.minbar{flex:1;height:7px;border-radius:7px;background:var(--bartrack);overflow:hidden;min-width:40px}
.minfill{height:100%;border-radius:7px;transition:width .4s}
.minlab{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap}
.minbtn{border:1px solid var(--line);background:var(--inp-bg);color:var(--ink);border-radius:9px;font-size:11.5px;font-weight:700;
  padding:5px 8px;cursor:pointer;font-family:inherit;flex-shrink:0;min-width:34px}
.minbtn:active{filter:brightness(.94);border-color:var(--accent);color:var(--accent)}
.goalpick{display:flex;gap:6px;flex-wrap:wrap}
.gopt{border:1.5px solid var(--line);background:var(--inp-bg);color:var(--sub);border-radius:12px;font-size:12px;font-weight:600;
  padding:6px 11px;cursor:pointer;font-family:inherit}
.gopt.on{border:2px solid var(--accent);background:var(--accent);color:#fff}

/* ===== Module Santé : Pas (anneau) + Eau (jauge) ===== */
.health{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
.hmod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}
.hlab{font-size:12px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:8px}
.hlab svg{width:14px;height:14px;color:var(--accent)}
.ringwrap{position:relative;width:88px;height:88px;margin:0 auto}
.ring{width:88px;height:88px;transform:rotate(-90deg)}
.ringbg{fill:none;stroke:var(--track);stroke-width:6}
.ringfg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--ink)}
.hsub{font-size:11.5px;color:var(--faint);margin-top:6px;font-weight:600}
.watergauge{position:relative;width:56px;height:88px;margin:0 auto;border-radius:14px;background:var(--track);overflow:hidden;border:1px solid var(--line)}
.waterfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5eb7ff,#0ea5e9);transition:height .5s cubic-bezier(.4,0,.2,1)}
.waternum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--ink);text-shadow:0 1px 2px rgba(255,255,255,.5)}
[data-theme="dark"] .waternum{text-shadow:0 1px 2px rgba(0,0,0,.5)}
.waterbtns{display:flex;gap:5px;justify-content:center;margin-top:9px;flex-wrap:wrap}
.wbtn{border:1px solid var(--line);background:var(--inp-bg);color:var(--ink);border-radius:10px;font-size:11px;font-weight:700;padding:6px 8px;cursor:pointer;font-family:inherit}
.wbtn:active{filter:brightness(.94);border-color:#0ea5e9;color:#0ea5e9}
.wbtn.sm{padding:6px 9px;color:var(--faint)}

/* ===== Vue Stats : filtre, calendrier, heatmap, records ===== */
.statfilter{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:15px;gap:10px}
.sf-lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);flex-shrink:0}
.sf-sel{background:var(--inp-bg);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:13px;font-weight:600;font-family:inherit;max-width:64%}
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:15px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.caltitle{margin:0;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.calnav{border:none;background:transparent;color:var(--faint);cursor:pointer;padding:6px;border-radius:50%;display:flex}
.calnav:active{background:var(--track)} .calnav svg{width:18px;height:18px}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10.5px;font-weight:700;color:var(--faint);margin-bottom:8px;text-transform:uppercase}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calcell{height:38px;display:flex;align-items:center;justify-content:center}
.calempty{height:38px}
.calday{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:600;color:var(--sub);border:1.5px solid transparent}
.calday.perfect{color:var(--ink);font-weight:800;border-width:2.5px}
.crown{position:absolute;top:-8px;right:-4px}
.crown svg{width:12px;height:12px}
.yrhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.yrhead h3{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.yrbadge{font-size:11px;font-family:ui-monospace,Menlo,monospace;background:var(--track);color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heatgrid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;width:max-content}
.hcell{width:11px;height:11px;border-radius:2px}
.reccards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:11px}
.recic{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.recic svg{width:19px;height:19px}
.recnum{font-size:22px;font-weight:900;color:var(--ink)}
.reclab{font-size:11px;color:var(--faint);font-weight:600}
.pcolors{display:flex;gap:8px}
.pcolor{width:25px;height:25px;border-radius:50%;cursor:pointer;border:none;padding:0}

/* preview framing only */
html,body{background:radial-gradient(1000px 500px at 50% -10%, #eef0f7, #e5e6ee)}
#app{max-width:440px;margin:0 auto}
</style>

    var t = findAct(e.target); if (!t) return;

    // setup screen actions

    else if (act === 'toggleEdit') { state.editSched[day] = !state.editSched[day]; changed = false; }
    else if (act === 'preset') { state.newSched = fromIdx(PRESETS[t.getAttribute('data-p')]); changed = false; }

    else if (act === 'goalEdit') { state.editGoalMin = parseInt(t.getAttribute('data-min'), 10) || 0; changed = false; }
    else if (act === 'addmin') { h = get(id); if (h) addMinutes(h, parseInt(t.getAttribute('data-min'), 10) || 0); }
    else if (act === 'addwater') { ensureHealth(); var _wt = todayStr(); state.health.water[_wt] = Math.max(0, (state.health.water[_wt] || 0) + (parseInt(t.getAttribute('data-ml'), 10) || 0)); afterChange(true); }
    else if (act === 'colorEdit') { state.editColor = t.getAttribute('data-color'); changed = false; }
    else if (act === 'add') { addHabit(); }
    else if (act === 'del') { state.habits = state.habits.filter(function (x) { return x.id !== id; }); }
    else if (act === 'edit') { h = get(id); state.editId = id; state.editName = h.name; state.editSched = Object.assign({}, h.scheduled); state.editColor = h.color; state.editGoalMin = h.goalMin || 0; changed = false; }
    else if (act === 'save') { saveEdit(); }
    else if (act === 'canceledit') { state.editId = null; changed = false; }
    else if (act === 'askreset') { state.confirmReset = true; changed = false; }
    else if (act === 'cancelreset') { state.confirmReset = false; changed = false; }
    else if (act === 'reset') { state.habits.forEach(function (x) { x.done = emptyDays(); }); state.confirmReset = false; }
    else return;

    if (changed) scheduleSave();
    render();
  });

  document.addEventListener('input', function (e) {
    var f = e.target.getAttribute && e.target.getAttribute('data-field');
    if (f === 'newName') {
      state.newName = e.target.value;
      var addBtn = document.querySelector('.add[data-act="add"]');
      if (addBtn) addBtn.disabled = !(state.newName.trim() && DAYS.some(function (d) { return state.newSched[d]; }));
    } else if (f === 'editName') state.editName = e.target.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var f = e.target.getAttribute && e.target.getAttribute('data-field');
    if (f === 'newName') { addHabit(); scheduleSave(); render(); }
    else if (f === 'editName') { saveEdit(); scheduleSave(); render(); }
  });

  function addHabit() {
    var name = state.newName.trim();
    if (!name || !DAYS.some(function (d) { return state.newSched[d]; })) return;
    state.habits.push({ id: uid(), name: name, scheduled: state.newSched, done: emptyDays(), color: state.newColor, goalMin: state.newGoalMin || 0, mins: {} });
    state.newName = ''; state.newSched = fromIdx(PRESETS.all); state.newColor = DEFAULT_COLOR; state.newGoalMin = 0;
  }
  function saveEdit() {
    var name = state.editName.trim();
    if (name && DAYS.some(function (d) { return state.editSched[d]; })) {
      var h = get(state.editId);
      if (h) { h.name = name; h.scheduled = Object.assign({}, state.editSched); h.color = state.editColor; h.goalMin = state.editGoalMin || 0; }
    }
    state.editId = null;
  }

  // refresh from server when app regains focus (e.g. after checking off then reopening)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.token && state.ready) { pullRemote().then(render); }
  });

  // ---- boot ----
  loadSettings();
  applyTheme();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (state.settings.theme === 'system') applyTheme(); }); } catch (e) {}
  document.addEventListener('change', function (e) { var f = e.target && e.target.getAttribute && e.target.getAttribute('data-field'); if (f === 'statHabit') { state.statHabit = e.target.value; render(); } });
  function refreshRemote() { if (!state.token || state.sync === 'busy') return; try { var pr = pullRemote(); if (pr && pr.then) pr.then(function () { state.ready = true; render(); }); } catch (e) {} }
  try { document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshRemote(); }); if (typeof window.addEventListener === 'function') window.addEventListener('focus', refreshRemote); } catch (e) {}
  state.token = loadToken();
  if (state.token) {
    render();
    pullRemote().then(function () { state.ready = true; render(); });
  } else {
    state.token = makeToken(); // pre-fill a suggested key on the setup screen
    render();
  }
})();

</script>
</body>
</html>
