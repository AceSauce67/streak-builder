<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>

<title>Streak Builder</title>
<style>
:root{--ink:#111827;--sub:#6b7280;--faint:#9ca3af;--line:#e6e8ee;--soft:#f0f1f5;--card:#fff;--surf:#f7f8fb;
--surf2:#f1f2f7;--track:#eef0f5;--inp:#fff;--acc:#16a34a;--accL:#54d98c;--accS:#e7f8ee;--danger:#ef4444}
[data-theme="dark"]{--ink:#f2f3f8;--sub:#a7adba;--faint:#7c8291;--line:#33353f;--soft:#2a2c34;--card:#1e1f27;
--surf:#262832;--surf2:#2a2c37;--track:#2f313d;--inp:#262832;--accS:#16a34a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
background:linear-gradient(160deg,#f3f4f8,#e9eaf2);min-height:100vh;padding:14px 12px 150px;color:var(--ink)}
[data-theme="dark"] body{background:linear-gradient(160deg,#15161c,#1b1c24)}
#app{max-width:440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 34px rgba(24,28,45,.07)}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.brandtitle{margin:0;font-size:19px;font-weight:800;letter-spacing:.14em}
.datesub{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);margin-top:3px}
.gear{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);
display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.gear.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.gear svg{width:18px;height:18px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.ph{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:8px}
.bar{background:var(--track);border-radius:9px;overflow:hidden}
.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--accL));transition:width .45s}
.health{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
.hmod{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center}
.hlab{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.ringwrap{position:relative;width:88px;height:88px;margin:0 auto}
.ring{width:88px;height:88px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--track);stroke-width:6}
.rfg{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s}
.rnum{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.hsub{font-size:11px;color:var(--faint);margin-top:6px;font-weight:600}
.gauge{position:relative;width:56px;height:88px;margin:0 auto;border-radius:14px;background:var(--track);overflow:hidden;border:1px solid var(--line)}
.gfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5eb7ff,#0ea5e9);transition:height .5s}
.gnum{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
.wbtns{display:flex;gap:5px;justify-content:center;margin-top:9px;flex-wrap:wrap}
.wbtn{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:10px;font-size:11px;font-weight:700;padding:6px 8px;cursor:pointer;font-family:inherit}
.days{display:flex;gap:5px;margin-bottom:16px}
.daycol{flex:1;border:none;background:transparent;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dlab{font-size:11px;font-weight:700;color:var(--faint)}.dlab.act{color:var(--acc)}.dlab.tod{color:var(--ink)}
.trk{position:relative;width:100%;max-width:30px;height:70px;border-radius:10px;background:var(--track);overflow:hidden}
.trk.sel{box-shadow:0 0 0 2px var(--acc)}
.tf{position:absolute;left:0;right:0;bottom:0;border-radius:10px;background:linear-gradient(180deg,var(--accL),var(--acc));transition:height .45s}
.dcnt{font-size:10.5px;color:var(--faint);font-weight:600}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.dayhead h2{margin:0;font-size:16px;font-weight:700}
.chip{margin-left:7px;font-size:10.5px;font-weight:700;color:var(--acc);background:var(--accS);padding:2px 8px;border-radius:20px}
.muted{font-size:12.5px;color:var(--sub);font-weight:600}
/* swipe row */
.swipe{position:relative;overflow:hidden;border-radius:12px;margin-bottom:2px}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:96px;background:var(--danger);color:#fff;
display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:none;font-family:inherit;cursor:pointer}
.row{position:relative;background:var(--card);display:flex;align-items:center;gap:11px;padding:10px 4px;
transition:transform .22s cubic-bezier(.4,0,.2,1);will-change:transform}
.row.dragging{transition:none}
.cbx{width:27px;height:27px;border-radius:8px;border:2px solid var(--line);background:var(--inp);cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.cbx svg{width:15px;height:15px;color:#fff}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.rname{font-size:14.5px;font-weight:600}.rname.done{color:var(--faint);text-decoration:line-through}
.rsub{font-size:11.5px;color:var(--faint);margin-top:2px}
.editbtn{border:none;background:transparent;color:var(--faint);cursor:pointer;padding:6px;flex-shrink:0}
.editbtn svg{width:16px;height:16px}
.gtag{font-size:10.5px;font-weight:700;color:var(--acc);background:var(--accS);padding:1px 7px;border-radius:20px;margin-left:5px}
.minrow{display:flex;align-items:center;gap:7px;margin-top:7px}
.minbar{flex:1;height:7px;border-radius:7px;background:var(--track);overflow:hidden;min-width:34px}
.minfill{height:100%;border-radius:7px;transition:width .4s}
.minlab{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap}
.minbtn{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:9px;font-size:11.5px;font-weight:700;padding:5px 7px;cursor:pointer;font-family:inherit}
.form{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:13px;margin-top:12px}
.form.editing{border-color:var(--acc);box-shadow:0 0 0 3px var(--accS)}
.formtitle{font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:9px}
.inp2{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;width:100%;background:var(--inp);color:var(--ink);font-family:inherit}
.flab{font-size:12px;font-weight:600;color:var(--sub);margin:12px 0 7px}
.pick{display:flex;gap:5px;flex-wrap:wrap}
.pday{width:34px;height:33px;border-radius:9px;border:1.5px solid var(--line);background:var(--inp);color:var(--faint);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.pday.on{border:2px solid var(--acc);background:var(--acc);color:#fff}
.pset{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.preset{border:1px solid var(--line);background:var(--inp);color:var(--sub);border-radius:20px;font-size:11.5px;font-weight:600;padding:5px 10px;cursor:pointer;font-family:inherit}
.sw{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0}
.gopt{border:1.5px solid var(--line);background:var(--inp);color:var(--sub);border-radius:12px;font-size:12px;font-weight:600;padding:6px 11px;cursor:pointer;font-family:inherit}
.gopt.on{border:2px solid var(--acc);background:var(--acc);color:#fff}
.add{border:none;border-radius:11px;background:var(--acc);color:#fff;font-weight:600;font-size:14px;padding:10px 15px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.ghost{border:1px solid var(--line);border-radius:11px;background:var(--inp);color:var(--sub);font-weight:600;font-size:14px;padding:10px 15px;cursor:pointer;font-family:inherit}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--soft)}
.lbl{font-size:13.5px;font-weight:600}
.segs{display:flex;gap:4px;background:var(--surf2);padding:3px;border-radius:11px}
.seg{border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
.seg.on{background:var(--acc);color:#fff}
.statf{display:flex;justify-content:space-between;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:14px;gap:10px}
.sfl{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--faint)}
.sfs{background:var(--inp);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:13px;font-weight:600;font-family:inherit;max-width:62%}
.calcard{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.caltitle{margin:0;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.calnav{border:none;background:transparent;color:var(--faint);cursor:pointer;padding:6px;font-size:18px;font-family:inherit}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10.5px;font-weight:700;color:var(--faint);margin-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calcell{height:38px;display:flex;align-items:center;justify-content:center}
.calday{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:600;color:var(--sub);border:1.5px solid transparent}
.calday.pf{color:var(--ink);font-weight:800;border-width:2.5px}
.crown{position:absolute;top:-9px;right:-3px;font-size:11px}
.yrhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.yrhead h3{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--faint)}
.yrb{font-size:11px;background:var(--track);color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.heatwrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;width:max-content}
.hc{width:10px;height:10px;border-radius:2px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rec{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:10px}
.recic{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px}
.recn{font-size:21px;font-weight:900}.recl{font-size:11px;color:var(--faint);font-weight:600}
.thero{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.tflame{width:48px;height:48px;border-radius:15px;background:linear-gradient(160deg,#ff9d3c,#f5580b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.tnum{font-size:29px;font-weight:800;line-height:1}
.tdays{font-size:14px;font-weight:600;color:var(--faint)}
.tbest{font-size:12.5px;color:var(--sub);margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;opacity:.68}
.tcard.got{opacity:1}
.tbadge{width:52px;height:52px;border-radius:16px;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;background:var(--track);font-size:23px}
.tname{font-size:14px;font-weight:700}
.tdesc{font-size:11.5px;color:var(--faint);margin:2px 0 9px;min-height:30px;line-height:1.3}
.tbar{height:7px;border-radius:7px;background:var(--track);overflow:hidden}
.tfill2{height:100%;border-radius:7px}
.tprog{font-size:11px;color:var(--faint);margin-top:5px;font-weight:600}
.tunl{font-size:12px;font-weight:700;margin-top:6px}
.tuto h2{margin:2px 0 6px;font-size:17px}
.tuto p{font-size:13px;color:var(--sub);line-height:1.45;margin:0 0 13px}
.tuto ol{margin:0 0 13px;padding-left:20px}
.tuto li{font-size:13px;line-height:1.45;margin-bottom:8px}
.urlbox{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;background:var(--surf);
border:1px solid var(--line);border-radius:12px;padding:11px 13px;line-height:1.5}
.note{font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.4}
.bottombar{position:fixed;left:50%;bottom:14px;width:calc(100% - 24px);max-width:440px;
display:flex;gap:2px;padding:6px;border-radius:26px;z-index:40;
background:rgba(255,255,255,.55);
-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
border:1px solid rgba(255,255,255,.55);
box-shadow:0 8px 32px rgba(20,22,40,.16),0 2px 8px rgba(20,22,40,.08),inset 0 1px 0 rgba(255,255,255,.65);
transform:translateX(-50%) translateY(0);
transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .28s ease;will-change:transform}
.bottombar.hidden{transform:translateX(-50%) translateY(130%);opacity:0}
[data-theme="dark"] .bottombar{background:rgba(28,29,37,.55);border-color:rgba(255,255,255,.1);
box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
/* pastille active qui glisse d'un onglet à l'autre */
.navind{position:absolute;top:6px;left:0;height:calc(100% - 12px);border-radius:20px;background:var(--acc);
box-shadow:0 4px 14px var(--accS);z-index:0;
transition:transform .42s cubic-bezier(.34,1.4,.5,1),width .42s cubic-bezier(.34,1.4,.5,1);will-change:transform,width}
.navind.noanim{transition:none}
.bb{position:relative;z-index:1;flex:1;border:none;background:transparent;color:var(--sub);cursor:pointer;font-family:inherit;
display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:20px;min-width:0;
transition:color .26s ease;-webkit-user-select:none;user-select:none}
.bb.on{color:#fff}
.bb svg{width:19px;height:19px;transition:transform .42s cubic-bezier(.34,1.5,.5,1)}
.bb.on svg{transform:translateY(-1px) scale(1.12)}
.bb.tapped svg{transform:scale(.82)}
.bbl{font-size:9.5px;font-weight:600;white-space:nowrap;transition:opacity .26s ease,transform .26s ease}
.bb.on .bbl{transform:translateY(1px)}
@media(prefers-reduced-motion:reduce){.navind,.bb svg,.bottombar{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:60;background:var(--acc);color:#fff;
padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.confetti{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:70;overflow:hidden}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
</style>
</head>

{id:'teal',m:'#0d9488',l:'#5ed6c8',s:'#e0f5f2'},{id:'green',m:'#16a34a',l:'#54d98c',s:'#e7f8ee'},

/* === PALETTE CENTRALE UNIQUE : couleurs d'accent, utilisées aussi pour
   les habitudes ET les jours parfaits (même liste, même ordre) === */
var COLORS=(function(){var o=[],i;for(i=0;i<ACC.length;i++){o.push(ACC[i].m);}return o;})();

var TODAY=(new Date().getDay()+6)%7,NOW=new Date(),LSKEY='streak-builder-v1';

/* ---------- state ---------- */
function fi(a){var o={},i;for(i=0;i<DAYS.length;i++){o[DAYS[i]]=a.indexOf(i)>=0;}return o;}
function ed(){var o={},i;for(i=0;i<DAYS.length;i++){o[DAYS[i]]=false;}return o;}
function uid(){return 'h'+Math.random().toString(36).slice(2,8);}
function seedHabits(){var out=[],i;for(i=0;i<DEFAULT_HABITS.length;i++){var d=DEFAULT_HABITS[i];
 out.push({id:uid(),key:d.key,name:'',sched:fi(d.days),done:ed(),color:d.color,goal:d.goal,mins:{}});}
 return out;}
function defState(){return{lang:(navigator.language||'fr').slice(0,2),theme:'auto',accent:'green',perfColor:COLORS[0],
 tab:'week',day:DAYS[TODAY],statHabit:'all',sy:NOW.getFullYear(),sm:NOW.getMonth(),
 newName:'',newSched:fi([0,1,2,3,4,5,6]),newColor:COLORS[1],newGoal:0,editId:null,
 water:0,steps:0,wgoal:2000,sgoal:10000,checks:0,streak:0,best:0,voice:false,unlocked:[],habits:seedHabits(),hist:{}};}
var S=defState();
if(['fr','en','es'].indexOf(S.lang)<0)S.lang='en';

function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}}
function load(){try{var raw=localStorage.getItem(LSKEY);if(!raw)return;var o=JSON.parse(raw);
 if(o&&typeof o==='object'){for(var k in o){if(Object.prototype.hasOwnProperty.call(o,k))S[k]=o[k];}}
 if(!S.habits||!S.habits.length)S.habits=seedHabits();
 if(['fr','en','es'].indexOf(S.lang)<0)S.lang='en';
 if(COLORS.indexOf(S.perfColor)<0)S.perfColor=COLORS[0];
 S.editId=null;}catch(e){}}
load();

/* --- synchro des pas via ?steps=XXXX (toutes plateformes) --- */
(function(){try{var p=new URLSearchParams(window.location.search);
 var st=p.get('steps');if(st!==null&&st!==''&&!isNaN(Number(st))){S.steps=Math.max(0,Math.round(Number(st)));save();}
 var wl=p.get('water');if(wl!==null&&wl!==''&&!isNaN(Number(wl))){S.water=Math.max(0,S.water+Math.round(Number(wl)));save();}
}catch(e){}})();

/* ---------- helpers ---------- */
function t(k){return T[S.lang][k];}
function hname(h){return (h.name&&h.name.length)?h.name:((HNAMES[h.key]&&HNAMES[h.key][S.lang])||'');}
function acc(){var i;for(i=0;i<ACC.length;i++){if(ACC[i].id===S.accent)return ACC[i];}return ACC[3];}
function isDark(){if(S.theme==='dark')return true;if(S.theme==='light')return false;
 try{return window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}
function theme(){var a=acc(),r=document.documentElement;r.setAttribute('data-theme',isDark()?'dark':'light');
 r.style.setProperty('--acc',a.m);r.style.setProperty('--accL',a.l);r.style.setProperty('--accS',isDark()?a.m+'3d':a.s);}
function sc(h){var n=0,i;for(i=0;i<DAYS.length;i++){if(h.sched[DAYS[i]])n++;}return n;}
function dc(h){var n=0,i;for(i=0;i<DAYS.length;i++){var d=DAYS[i];if(h.sched[d]&&h.done[d])n++;}return n;}
function dayH(d){var o=[],i;for(i=0;i<S.habits.length;i++){if(S.habits[i].sched[d])o.push(S.habits[i]);}return o;}
function dayDone(d){var l=dayH(d),n=0,i;for(i=0;i<l.length;i++){if(l[i].done[d])n++;}return n;}
function dayPct(d){var s=dayH(d).length;return s?Math.round(dayDone(d)/s*100):0;}
function total(f){var n=0,i;for(i=0;i<S.habits.length;i++){n+=f(S.habits[i]);}return n;}
function adh(){var s=total(sc);return s?Math.round(total(dc)/s*100):0;}
function schedTxt(h){var c=sc(h),o=[],i;if(c===7)return t('everyday');
 if(c===5&&h.sched.Monday&&h.sched.Friday&&!h.sched.Saturday&&!h.sched.Sunday)return t('weekdays');
 if(c===2&&h.sched.Saturday&&h.sched.Sunday)return t('weekends');
 for(i=0;i<DAYS.length;i++){if(h.sched[DAYS[i]])o.push(DS[S.lang][i]);}return o.join(', ');}
function ymd(y,m,d){return y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2);}
function todayStr(){return ymd(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());}
function perfect(ds){var h=S.hist[ds];if(!h)return false;return S.statHabit==='all'?h.perfect:((h.done||[]).indexOf(S.statHabit)>=0);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function getH(id){var i;for(i=0;i<S.habits.length;i++){if(S.habits[i].id===id)return S.habits[i];}return null;}
function recordHistory(){var l=dayH(DAYS[TODAY]),ids=[],i;for(i=0;i<l.length;i++){if(l[i].done[DAYS[TODAY]])ids.push(l[i].id);}
 S.hist[todayStr()]={perfect:l.length>0&&ids.length>=l.length,done:ids};}

/* ---------- colour picker (palette centrale unique) ---------- */
function colorPicker(current,action,ringBg){var o='<div class="pick">',i;
 for(i=0;i<COLORS.length;i++){var c=COLORS[i];
  o+='<button class="sw" data-a="'+action+'" data-v="'+c+'" style="background:'+c+(c===current?';box-shadow:0 0 0 2px '+ringBg+',0 0 0 4px '+c:'')+'"></button>';}
 return o+'</div>';}

/* ---------- views ---------- */
function habitForm(){
 var editing=!!S.editId,h=editing?getH(S.editId):null,i;
 var name=editing?(S.newName!==null?S.newName:hname(h)):S.newName;
 var o='<div class="form'+(editing?' editing':'')+'">'+(editing?'<div class="formtitle">'+t('edittitle')+'</div>':'');
 o+='<input class="inp2" id="nn" placeholder="'+t('addph')+'" value="'+esc(name)+'">';
 o+='<div class="flab">'+t('onwhich')+'</div><div class="pick">';
 for(i=0;i<DAYS.length;i++){o+='<button class="pday'+(S.newSched[DAYS[i]]?' on':'')+'" data-a="nd" data-v="'+DAYS[i]+'">'+DS[S.lang][i].slice(0,2)+'</button>';}
 o+='</div><div class="pset"><button class="preset" data-a="ps" data-v="all">'+t('everyday')+'</button><button class="preset" data-a="ps" data-v="wd">'+t('weekdays')+'</button><button class="preset" data-a="ps" data-v="we">'+t('weekends')+'</button></div>';

 o+='<div class="flab">'+t('goal')+'</div><div class="pick">';
 var G=[0,5,10,15,20,30,45,60];
 for(i=0;i<G.length;i++){o+='<button class="gopt'+(G[i]===S.newGoal?' on':'')+'" data-a="ng" data-v="'+G[i]+'">'+(G[i]?G[i]:t('none'))+'</button>';}
 o+='</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">';
 if(editing)o+='<button class="ghost" data-a="canceledit">'+t('cancel')+'</button>';
 o+='<button class="add" data-a="'+(editing?'saveedit':'add')+'">'+(editing?t('save'):'+ '+t('add'))+'</button></div></div>';
 return o;}

function vWeek(){
 var w=Math.min(100,Math.round(S.water/S.wgoal*100)),sp=Math.min(100,Math.round(S.steps/S.sgoal*100));
 var C=2*Math.PI*26,off=C*(1-sp/100),i;
 var o='<div class="panel"><div class="ph"><span>'+t('weekprog')+'</span><span style="color:var(--ink);font-weight:700">'+adh()+'%</span></div><div class="bar" style="height:10px"><div class="fill" style="width:'+adh()+'%"></div></div></div>';
 o+='<div class="health"><div class="hmod"><div class="hlab">\ud83d\udc5f '+t('steps')+'</div><div class="ringwrap"><svg viewBox="0 0 64 64" class="ring"><circle cx="32" cy="32" r="26" class="rbg"></circle><circle cx="32" cy="32" r="26" class="rfg" style="stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+off.toFixed(1)+'"></circle></svg><div class="rnum">'+S.steps.toLocaleString()+'</div></div><div class="hsub">'+sp+'% \u00b7 '+S.sgoal.toLocaleString()+'</div></div>';
 o+='<div class="hmod"><div class="hlab">\ud83d\udca7 '+t('water')+'</div><div class="gauge"><div class="gfill" style="height:'+w+'%"></div><div class="gnum">'+(S.water/1000).toFixed(2)+'/'+(S.wgoal/1000)+' L</div></div><div class="wbtns"><button class="wbtn" data-a="w" data-v="250">+0.25 L</button><button class="wbtn" data-a="w" data-v="500">+0.5 L</button><button class="wbtn" data-a="w" data-v="1000">+1 L</button><button class="wbtn" data-a="w" data-v="-250">\u2212</button></div></div></div>';
 o+='<div class="days">';
 for(i=0;i<DAYS.length;i++){var d=DAYS[i],a=S.day===d,s2=dayH(d).length;
  o+='<button class="daycol" data-a="day" data-v="'+d+'"><span class="dlab'+(a?' act':(i===TODAY?' tod':''))+'">'+DS[S.lang][i]+'</span><span class="trk'+(a?' sel':'')+'"><span class="tf" style="height:'+dayPct(d)+'%"></span></span><span class="dcnt">'+(s2?dayDone(d)+'/'+s2:'\u2013')+'</span></button>';}
 o+='</div>';
 var s=dayH(S.day).length;
 o+='<div class="dayhead"><h2>'+DF[S.lang][DAYS.indexOf(S.day)]+(DAYS[TODAY]===S.day?'<span class="chip">'+t('today')+'</span>':'')+'</h2>'+(s?'<span class="muted">'+dayDone(S.day)+' '+t('of')+' '+s+'</span>':'')+'</div>';
 if(s)o+='<div class="bar" style="height:8px;margin-bottom:10px"><div class="fill" style="width:'+dayPct(S.day)+'%"></div></div>';
 var list=dayH(S.day);
 for(i=0;i<list.length;i++){var h=list[i],on=h.done[S.day],mn=h.mins[S.day]||0;
  o+='<div class="swipe" data-swipe="'+h.id+'"><button class="swipe-del" data-a="del" data-v="'+h.id+'">\ud83d\uddd1 '+t('del')+'</button>'+
   '<div class="row" data-rowid="'+h.id+'">'+
   '<button class="cbx" data-a="tog" data-v="'+h.id+'" style="'+(on?'background:'+h.color+';border-color:'+h.color:'')+'">'+(on?I.check:'')+'</button>'+
   '<div style="flex:1;min-width:0"><div class="rname'+(on?' done':'')+'"><span class="cdot" style="background:'+h.color+'"></span>'+esc(hname(h))+(h.goal?'<span class="gtag">'+h.goal+' min</span>':'')+'</div>'+
   '<div class="rsub">'+dc(h)+'/'+sc(h)+' '+t('thisweek')+' \u00b7 '+schedTxt(h)+'</div>'+
   (h.goal?'<div class="minrow"><div class="minbar"><div class="minfill" style="width:'+Math.min(100,Math.round(mn/h.goal*100))+'%;background:'+h.color+'"></div></div><span class="minlab">'+mn+'/'+h.goal+' min</span><button class="minbtn" data-a="min" data-v="'+h.id+'" data-n="-5">\u22125</button><button class="minbtn" data-a="min" data-v="'+h.id+'" data-n="5">+5</button><button class="minbtn" data-a="min" data-v="'+h.id+'" data-n="15">+15</button></div>':'')+
   '</div><button class="editbtn" data-a="edit" data-v="'+h.id+'">'+I.pencil+'</button></div></div>';}
 if(!s)o+='<div style="text-align:center;color:var(--faint);padding:22px 0;font-size:13px">\ud83c\udf19 '+t('rest')+'</div>';
 if(s)o+='<div class="note" style="text-align:center;margin-top:4px">'+t('swipehint')+'</div>';
 o+=habitForm();
 return o;}

 for(i=0;i<S.habits.length;i++){o+='<option value="'+S.habits[i].id+'"'+(S.statHabit===S.habits[i].id?' selected':'')+'>'+esc(hname(S.habits[i]))+'</option>';}

 return o;}

function vTroph(){
 var o='<div class="thero"><div class="tflame">\ud83d\udd25</div><div><div class="tnum">'+S.streak+' <span class="tdays">'+t('days')+'</span></div><div class="tbest">'+t('streak')+' \u00b7 '+t('best')+' '+S.best+'</div></div></div><div class="tgrid">',i;
 for(i=0;i<ACH.length;i++){var a=ACH[i],v=a.v(),got=v>=a.th,nm=a.n[S.lang];
  o+='<div class="tcard'+(got?' got':'')+'"><div class="tbadge"'+(got?' style="background:'+a.c+';box-shadow:0 6px 18px '+a.c+'55"':'')+'>'+a.ic+'</div><div class="tname">'+nm[0]+'</div><div class="tdesc">'+nm[1]+'</div>'+
  (got?'<div class="tunl" style="color:'+a.c+'">\u2713 '+t('unlocked')+'</div>':'<div class="tbar"><div class="tfill2" style="width:'+Math.min(100,Math.round(v/a.th*100))+'%;background:'+a.c+'"></div></div><div class="tprog">'+v+' / '+a.th+'</div>')+'</div>';}
 return o+'</div>';}

function vTuto(){
 var base='';try{base=window.location.origin+window.location.pathname;}catch(e){}
 var url=base+'api/check?key=TA_CLE&lang='+S.lang+'&habit=course';
 var o='<div class="tuto"><h2>'+t('tutotitle')+'</h2><p>'+t('tutointro')+'</p><ol>',st=T[S.lang].st,i;
 for(i=0;i<st.length;i++){o+='<li>'+st[i]+'</li>';}
 o+='</ol><div class="urlbox">'+esc(url)+'</div>';
 o+='<div class="flab">'+t('steps')+' \u2014 ?steps=XXXX</div><div class="urlbox">'+esc(base+'?steps=8500')+'</div>';
 return o+'<p class="note">'+t('note')+'</p></div>';}

function vProfile(){
 var o='<div class="setrow" style="border-top:none"><span class="lbl">'+t('theme')+'</span><div class="segs">',i;
 var TH=[['auto',t('auto')],['light',t('light')],['dark',t('dark')]];
 for(i=0;i<TH.length;i++){o+='<button class="seg'+(S.theme===TH[i][0]?' on':'')+'" data-a="th" data-v="'+TH[i][0]+'">'+TH[i][1]+'</button>';}
 o+='</div></div><div class="setrow"><span class="lbl">'+t('language')+'</span><div class="segs">';
 var LG=['fr','en','es'];
 for(i=0;i<LG.length;i++){o+='<button class="seg'+(S.lang===LG[i]?' on':'')+'" data-a="lang" data-v="'+LG[i]+'">'+LG[i].toUpperCase()+'</button>';}
 o+='</div></div><div class="setrow"><span class="lbl">'+t('accent')+'</span><div class="pick">';
 for(i=0;i<ACC.length;i++){o+='<button class="sw" data-a="ac" data-v="'+ACC[i].id+'" style="background:'+ACC[i].m+(S.accent===ACC[i].id?';box-shadow:0 0 0 2px var(--card),0 0 0 4px '+ACC[i].m:'')+'"></button>';}
 o+='</div></div><div class="setrow"><span class="lbl">'+t('wgoal')+'</span><div class="pick">';
 var WG=[1500,2000,2500,3000];
 for(i=0;i<WG.length;i++){o+='<button class="gopt'+(S.wgoal===WG[i]?' on':'')+'" data-a="wg" data-v="'+WG[i]+'">'+(WG[i]/1000)+' L</button>';}
 o+='</div></div><div class="setrow"><span class="lbl">'+t('sgoal')+'</span><div class="pick">';
 var SG=[6000,8000,10000,12000,15000];
 for(i=0;i<SG.length;i++){o+='<button class="gopt'+(S.sgoal===SG[i]?' on':'')+'" data-a="sg" data-v="'+SG[i]+'">'+(SG[i]/1000)+'k</button>';}
 /* même palette que les habitudes, même ordre */
 o+='</div></div><div class="setrow"><span class="lbl">'+t('pcolor')+'</span>'+colorPicker(S.perfColor,'pc','var(--card)')+'</div>';
 o+='<div class="setrow"><span class="lbl">'+t('reset')+'</span><button class="ghost" data-a="resetall">'+t('reset')+'</button></div>';
 return o;}

function render(){
 var loc={fr:'fr-FR',en:'en-US',es:'es-ES'}[S.lang],ds='';
 try{ds=NOW.toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long'}).toUpperCase();}catch(e){ds='';}
 var body=S.tab==='week'?vWeek():S.tab==='stats'?vStats():S.tab==='troph'?vTroph():S.tab==='tuto'?vTuto():vProfile();
 document.getElementById('app').innerHTML='<div class="card"><div class="head"><div><h1 class="brandtitle">STREAK BUILDER</h1><div class="datesub">'+ds+'</div></div><button class="gear'+(S.tab==='profile'?' on':'')+'" data-a="tab" data-v="profile">'+I.gear+'</button></div>'+body+'</div>';
 buildNav();updateNav();
 bindSwipe();}

/* ---------- barre du bas : construite UNE fois, puis animée ---------- */
var TABS=[['week','cal'],['stats','stats'],['troph','medal'],['tuto','help'],['profile','user']];
function buildNav(){
 var bb=document.getElementById('bb');
 if(bb.getAttribute('data-built')==='1'){
  /* met juste à jour les libellés (changement de langue) */
  var ls=bb.querySelectorAll('.bbl'),i;
  for(i=0;i<TABS.length;i++){if(ls[i])ls[i].textContent=t(TABS[i][0]);}
  return;}
 var h='<div class="navind noanim" id="navind"></div>',k;
 for(k=0;k<TABS.length;k++){
  h+='<button class="bb" data-a="tab" data-v="'+TABS[k][0]+'">'+I[TABS[k][1]]+'<span class="bbl">'+t(TABS[k][0])+'</span></button>';}
 bb.innerHTML=h;bb.setAttribute('data-built','1');}
function updateNav(){
 var bb=document.getElementById('bb'),ind=document.getElementById('navind');
 if(!bb||!ind)return;
 var btns=bb.querySelectorAll('.bb'),i,active=null;
 for(i=0;i<btns.length;i++){
  var on=btns[i].getAttribute('data-v')===S.tab;
  if(on){btns[i].className='bb on';active=btns[i];}
  else{btns[i].className='bb';}}
 if(!active)return;
 var move=function(){
  ind.style.width=active.offsetWidth+'px';
  ind.style.transform='translateX('+active.offsetLeft+'px)';};
 if(ind.classList.contains('noanim')){move();
  /* laisse le navigateur peindre la position initiale avant d'activer l'animation */
  requestAnimationFrame(function(){requestAnimationFrame(function(){ind.classList.remove('noanim');});});}
 else{move();}}

/* ---------- feedback ---------- */
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.className='toast show';
 clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='toast';},2200);}
function confetti(){var c=document.createElement('div');c.className='confetti';document.body.appendChild(c);
 var cols=['#f5b301','#5bd6e6','#8b5cf6','#22c55e','#ef4444','#3b82f6'],i;
 for(i=0;i<40;i++){var p=document.createElement('i');
  p.style.cssText='position:absolute;top:-14px;left:'+(Math.random()*100)+'%;width:'+(6+Math.random()*6)+'px;height:'+(4+Math.random()*4)+'px;background:'+cols[i%6]+';animation:fall '+(1.6+Math.random()*1.1)+'s cubic-bezier(.3,.6,.5,1) '+(Math.random()*0.25)+'s forwards';
  c.appendChild(p);}
 setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},3200);}
function checkUnlocks(){var newly=[],i;
 for(i=0;i<ACH.length;i++){var a=ACH[i];if(a.v()>=a.th&&S.unlocked.indexOf(a.id)<0){S.unlocked.push(a.id);newly.push(a.n[S.lang][0]);}}
 if(newly.length){toast(t('unlockmsg')+' '+newly[0]);confetti();}}

/* ---------- SWIPE-TO-DELETE (iOS style) ---------- */
function bindSwipe(){
 var rows=document.querySelectorAll('.row[data-rowid]'),i;
 for(i=0;i<rows.length;i++){(function(row){
  var x0=0,y0=0,dx=0,open=false,lock=null;
  row.addEventListener('touchstart',function(e){
   var tch=e.touches[0];x0=tch.clientX;y0=tch.clientY;dx=open?-96:0;lock=null;row.classList.add('dragging');},{passive:true});
  row.addEventListener('touchmove',function(e){
   var tch=e.touches[0],mx=tch.clientX-x0,my=tch.clientY-y0;
   if(lock===null){if(Math.abs(mx)>8||Math.abs(my)>8)lock=Math.abs(mx)>Math.abs(my)?'x':'y';}
   if(lock!=='x')return;
   if(e.cancelable)e.preventDefault();
   var base=open?-96:0,d=Math.min(0,Math.max(-140,base+mx));
   dx=d;row.style.transform='translateX('+d+'px)';},{passive:false});
  row.addEventListener('touchend',function(){
   row.classList.remove('dragging');
   if(dx<-58){open=true;row.style.transform='translateX(-96px)';}
   else{open=false;row.style.transform='translateX(0)';}},{passive:true});
  row.addEventListener('touchcancel',function(){row.classList.remove('dragging');open=false;row.style.transform='translateX(0)';},{passive:true});
 })(rows[i]);}}

/* ---------- edit mode ---------- */
function startEdit(id){var h=getH(id);if(!h)return;
 S.editId=id;S.newName=hname(h);S.newSched=JSON.parse(JSON.stringify(h.sched));S.newColor=h.color;S.newGoal=h.goal||0;
 S.tab='week';render();
 var el=document.getElementById('nn');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
function resetForm(){S.editId=null;S.newName='';S.newSched=fi([0,1,2,3,4,5,6]);S.newColor=COLORS[1];S.newGoal=0;}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var el=e.target;
 while(el&&el!==document.body&&!(el.getAttribute&&el.getAttribute('data-a'))){el=el.parentNode;}
 if(!el||el===document.body)return;
 var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),h;
 if(a==='tab'){S.tab=v;}
 else if(a==='day'){S.day=v;}
 else if(a==='tog'){h=getH(v);if(h){h.done[S.day]=!h.done[S.day];if(h.done[S.day])S.checks++;recordHistory();}}
 else if(a==='min'){h=getH(v);var n=parseInt(el.getAttribute('data-n'),10);
  if(h){h.mins[S.day]=Math.max(0,(h.mins[S.day]||0)+n);if(h.goal)h.done[S.day]=h.mins[S.day]>=h.goal;recordHistory();}}
 else if(a==='w'){S.water=Math.max(0,S.water+parseInt(v,10));}
 else if(a==='nd'){S.newSched[v]=!S.newSched[v];}
 else if(a==='ps'){S.newSched=v==='all'?fi([0,1,2,3,4,5,6]):(v==='wd'?fi([0,1,2,3,4]):fi([5,6]));}
 else if(a==='nc'){S.newColor=v;}
 else if(a==='ng'){S.newGoal=parseInt(v,10);}
 else if(a==='edit'){startEdit(v);save();return;}
 else if(a==='canceledit'){resetForm();}
 else if(a==='saveedit'){h=getH(S.editId);
  var inp0=document.getElementById('nn'),nm0=(inp0&&inp0.value||'').trim();
  if(h){if(nm0){h.name=nm0;h.key=null;}h.sched=JSON.parse(JSON.stringify(S.newSched));h.color=S.newColor;h.goal=S.newGoal;
   if(h.goal){var dd=h.mins[S.day]||0;h.done[S.day]=dd>=h.goal;}recordHistory();}
  resetForm();}
 else if(a==='add'){var inp=document.getElementById('nn'),nm=(inp&&inp.value||'').trim();
  if(nm){S.habits.push({id:uid(),key:null,name:nm,sched:JSON.parse(JSON.stringify(S.newSched)),done:ed(),color:S.newColor,goal:S.newGoal,mins:{}});resetForm();}}
 else if(a==='del'){var out=[],i;for(i=0;i<S.habits.length;i++){if(S.habits[i].id!==v)out.push(S.habits[i]);}
  S.habits=out;if(S.editId===v)resetForm();if(S.statHabit===v)S.statHabit='all';recordHistory();toast(t('deleted'));}
 else if(a==='pm'){S.sm--;if(S.sm<0){S.sm=11;S.sy--;}}
 else if(a==='nm'){S.sm++;if(S.sm>11){S.sm=0;S.sy++;}}
 else if(a==='th'){S.theme=v;theme();}
 else if(a==='lang'){S.lang=v;}
 else if(a==='ac'){S.accent=v;theme();}
 else if(a==='wg'){S.wgoal=parseInt(v,10);}
 else if(a==='sg'){S.sgoal=parseInt(v,10);}
 else if(a==='pc'){S.perfColor=v;}
 else if(a==='resetall'){S=defState();theme();}
 else{return;}
 checkUnlocks();save();render();});

document.addEventListener('change',function(e){if(e.target&&e.target.id==='sf'){S.statHabit=e.target.value;save();render();}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='nn')S.newName=e.target.value;});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.theme==='auto'){theme();render();}});}catch(e){}

/* --- retour tactile immédiat sur les onglets (rebond de l'icône) --- */
document.addEventListener('touchstart',function(e){
 var el=e.target;while(el&&el!==document.body&&!(el.classList&&el.classList.contains('bb'))){el=el.parentNode;}
 if(el&&el.classList&&el.classList.contains('bb')){el.classList.add('tapped');
  setTimeout(function(){el.classList.remove('tapped');},170);}},{passive:true});

/* --- la barre s'efface quand on descend, revient quand on remonte --- */
(function(){var lastY=0,ticking=false;
 function onScroll(){
  var y=window.pageYOffset||document.documentElement.scrollTop||0,bb=document.getElementById('bb');
  if(bb){var down=y>lastY+6,up=y<lastY-6;
   if(down&&y>90)bb.classList.add('hidden');
   else if(up||y<=90)bb.classList.remove('hidden');}
  lastY=y;ticking=false;}
 window.addEventListener('scroll',function(){
  if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});})();
window.addEventListener('resize',function(){updateNav();});

theme();
S.unlocked=[];
(function(){var i;for(i=0;i<ACH.length;i++){if(ACH[i].v()>=ACH[i].th)S.unlocked.push(ACH[i].id);}})();
render();
</script>
